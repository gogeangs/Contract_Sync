<!DOCTYPE html>
<html lang="ko" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Sync v2 - 보고서 편집기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    [x-cloak] { display: none !important; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .skeleton { background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; }
    html.dark .skeleton { background: linear-gradient(90deg, #374151 25%, #4b5563 50%, #374151 75%); background-size: 200% 100%; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300">

<div x-data="appLayout()" class="flex h-screen overflow-hidden">

  <!-- 좌측 사이드바 -->
  <aside class="hidden lg:flex lg:flex-col w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 fixed inset-y-0 left-0 z-30">
    <div class="flex items-center gap-3 px-6 py-5 border-b border-gray-200 dark:border-gray-700">
      <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      </div>
      <span class="text-lg font-bold text-gray-800 dark:text-white">Contract Sync</span>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>대시보드</span>
      </a>
      <a href="report-hub.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-medium text-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span>보고서</span>
      </a>
    </nav>
  </aside>

  <!-- 메인 영역 -->
  <div class="flex-1 flex flex-col lg:ml-64 overflow-hidden">
    <!-- 헤더 -->
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 lg:px-6 py-3 flex items-center justify-between sticky top-0 z-20">
      <div class="flex items-center gap-3">
        <a href="report-hub.html" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
          <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <nav class="text-sm text-gray-500 dark:text-gray-400 hidden sm:flex items-center gap-1">
          <a href="report-hub.html" class="hover:text-indigo-600">보고서</a>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          <span class="text-gray-800 dark:text-white font-medium">편집기</span>
        </nav>
      </div>
      <div class="flex items-center gap-2">
        <button class="px-3 py-1.5 text-sm text-gray-600 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">임시저장</button>
        <button class="px-3 py-1.5 text-sm text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 font-medium">발송</button>
        <button @click="toggleDark()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
          <svg x-show="!darkMode" class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          <svg x-show="darkMode" x-cloak class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </button>
      </div>
    </header>

    <!-- 콘텐츠 -->
    <main class="flex-1 overflow-y-auto" x-data="reportEditorPage()">
      <div class="flex flex-col lg:flex-row h-full">

        <!-- 에디터 (좌측 2/3) -->
        <div class="flex-1 lg:w-2/3 p-4 lg:p-6 overflow-y-auto">
          <!-- 제목 -->
          <input type="text" x-model="title" placeholder="보고서 제목을 입력하세요" class="w-full text-2xl font-bold text-gray-800 dark:text-white bg-transparent border-none outline-none placeholder-gray-300 dark:placeholder-gray-600 mb-4">

          <!-- 에디터 툴바 -->
          <div class="flex items-center gap-1 p-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-t-lg">
            <button class="p-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-400 font-bold text-sm">B</button>
            <button class="p-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-400 italic text-sm">I</button>
            <button class="p-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-400 underline text-sm">U</button>
            <div class="w-px h-5 bg-gray-200 dark:bg-gray-600 mx-1"></div>
            <button class="p-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h10M4 18h7"/></svg>
            </button>
            <button class="p-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="w-px h-5 bg-gray-200 dark:bg-gray-600 mx-1"></div>
            <select class="text-xs bg-transparent border border-gray-200 dark:border-gray-600 rounded px-2 py-1 text-gray-600 dark:text-gray-400">
              <option>본문</option>
              <option>제목 1</option>
              <option>제목 2</option>
              <option>제목 3</option>
            </select>
          </div>

          <!-- 에디터 본문 -->
          <div contenteditable="true" class="w-full min-h-[400px] p-4 bg-white dark:bg-gray-800 border border-t-0 border-gray-200 dark:border-gray-700 rounded-b-lg text-sm text-gray-700 dark:text-gray-300 leading-relaxed focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-3">1. 이번 주 주요 성과</h3>
            <ul class="list-disc list-inside space-y-1 mb-4">
              <li>API 설계서 작성 완료 (26개 엔드포인트)</li>
              <li>DB 마이그레이션 스키마 확정</li>
              <li>프론트엔드 공통 컴포넌트 개발 착수</li>
            </ul>
            <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-3">2. 진행 중인 업무</h3>
            <ul class="list-disc list-inside space-y-1 mb-4">
              <li>프론트엔드 개발 (진행률 30%)</li>
              <li>QA 테스트 환경 구축</li>
            </ul>
            <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-3">3. 다음 주 계획</h3>
            <ul class="list-disc list-inside space-y-1">
              <li>화면설계서 검토 완료</li>
              <li>프론트엔드 주요 페이지 구현</li>
              <li>백엔드 API 연동 테스트</li>
            </ul>
          </div>
        </div>

        <!-- 설정 패널 (우측 1/3) -->
        <div class="lg:w-1/3 bg-white dark:bg-gray-800 border-t lg:border-t-0 lg:border-l border-gray-200 dark:border-gray-700 p-4 lg:p-6 overflow-y-auto space-y-6">

          <!-- 보고서 유형 -->
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">보고서 유형</label>
            <div class="flex gap-2">
              <template x-for="t in ['주간', '월간', '프로젝트']" :key="t">
                <button @click="reportType = t" :class="reportType === t ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-300 border-gray-300 dark:border-gray-600'" class="flex-1 px-3 py-2 text-sm font-medium border rounded-lg transition-colors" x-text="t"></button>
              </template>
            </div>
          </div>

          <!-- 대상 기간 -->
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">대상 기간</label>
            <div class="flex items-center gap-2">
              <input type="date" x-model="dateFrom" class="flex-1 px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200">
              <span class="text-gray-400">~</span>
              <input type="date" x-model="dateTo" class="flex-1 px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200">
            </div>
          </div>

          <!-- 프로젝트 선택 -->
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">프로젝트</label>
            <select x-model="projectId" class="w-full px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200">
              <option value="">전체</option>
              <option value="1">OO시스템 구축</option>
              <option value="2">웹사이트 리뉴얼</option>
              <option value="3">모바일 앱</option>
            </select>
          </div>

          <!-- 수신자 -->
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">수신자</label>
            <div class="flex flex-wrap gap-2 p-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 min-h-[40px]">
              <template x-for="(r, idx) in recipients" :key="idx">
                <span class="inline-flex items-center gap-1 px-2 py-1 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-400 text-xs rounded-full">
                  <span x-text="r"></span>
                  <button @click="recipients.splice(idx, 1)" class="hover:text-red-500">&times;</button>
                </span>
              </template>
              <input type="email" placeholder="이메일 입력 후 Enter" @keydown.enter.prevent="if($el.value.trim()) { recipients.push($el.value.trim()); $el.value = ''; }" class="flex-1 min-w-[120px] text-sm bg-transparent outline-none text-gray-800 dark:text-gray-200 placeholder-gray-400">
            </div>
          </div>

          <!-- AI 초안 생성 -->
          <div class="border-t border-gray-200 dark:border-gray-700 pt-4">
            <button @click="showAiModal = true" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm font-medium transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
              AI 초안 생성
            </button>
            <p class="text-xs text-gray-400 dark:text-gray-500 mt-2 text-center">Gemini AI가 프로젝트 데이터를 기반으로 보고서 초안을 작성합니다</p>
          </div>

          <!-- 예약 발송 -->
          <div class="border-t border-gray-200 dark:border-gray-700 pt-4">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">예약 발송</label>
            <div class="flex items-center gap-2">
              <input type="datetime-local" class="flex-1 px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200">
              <button class="px-3 py-2 text-sm text-indigo-600 dark:text-indigo-400 border border-indigo-300 dark:border-indigo-700 rounded-lg hover:bg-indigo-50 dark:hover:bg-indigo-900/20 font-medium">예약</button>
            </div>
          </div>

        </div>
      </div>

      <!-- AI 초안 모달 -->
      <div x-show="showAiModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div @click="showAiModal = false" class="absolute inset-0 bg-black bg-opacity-50"></div>
        <div class="relative bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-lg max-h-[80vh] overflow-y-auto" x-transition>
          <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-700">
            <h3 class="text-lg font-semibold text-gray-800 dark:text-white flex items-center gap-2">
              <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
              AI 초안 생성
            </h3>
            <button @click="showAiModal = false" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
          <div class="px-6 py-4">
            <!-- 로딩 스켈레톤 -->
            <template x-if="aiLoading">
              <div class="space-y-3">
                <div class="skeleton h-4 w-3/4"></div>
                <div class="skeleton h-4 w-full"></div>
                <div class="skeleton h-4 w-5/6"></div>
                <div class="skeleton h-4 w-2/3"></div>
                <div class="skeleton h-4 w-full"></div>
                <div class="skeleton h-4 w-4/5"></div>
                <p class="text-center text-sm text-gray-400 dark:text-gray-500 mt-4">AI가 보고서를 작성하고 있습니다...</p>
              </div>
            </template>
            <!-- 생성 결과 -->
            <template x-if="!aiLoading">
              <div>
                <div class="prose prose-sm dark:prose-invert max-w-none text-gray-700 dark:text-gray-300 text-sm leading-relaxed p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg border border-gray-200 dark:border-gray-600">
                  <p><strong>1. 이번 주 주요 성과</strong></p>
                  <p>OO시스템 구축 프로젝트에서 API 설계서 26개 엔드포인트 작성이 완료되었습니다. DB 마이그레이션을 위한 스키마가 확정되었으며, 프론트엔드 공통 컴포넌트 개발에 착수했습니다.</p>
                  <p><strong>2. 주요 이슈</strong></p>
                  <p>화면설계서 검토 피드백이 지연되고 있어 담당자 확인이 필요합니다.</p>
                </div>
              </div>
            </template>
          </div>
          <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200 dark:border-gray-700">
            <button @click="showAiModal = false" class="px-4 py-2 text-sm text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600">취소</button>
            <button class="px-4 py-2 text-sm text-indigo-600 dark:text-indigo-400 border border-indigo-300 dark:border-indigo-700 rounded-lg hover:bg-indigo-50 dark:hover:bg-indigo-900/20">재생성</button>
            <button @click="showAiModal = false" class="px-4 py-2 text-sm text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 font-medium">적용</button>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script>
function appLayout() {
  return {
    mobileMenu: false,
    darkMode: localStorage.getItem('darkMode') === 'true' || window.matchMedia('(prefers-color-scheme: dark)').matches,
    init() { this.applyDark(); },
    toggleDark() { this.darkMode = !this.darkMode; localStorage.setItem('darkMode', this.darkMode); this.applyDark(); },
    applyDark() { document.documentElement.classList.toggle('dark', this.darkMode); }
  }
}

function reportEditorPage() {
  return {
    title: '3월 1주차 주간 보고서',
    reportType: '주간',
    dateFrom: '2026-03-03',
    dateTo: '2026-03-07',
    projectId: '1',
    recipients: ['kim@douzone.com', 'lee@abctech.com'],
    showAiModal: false,
    aiLoading: false
  }
}
</script>
</body>
</html>
