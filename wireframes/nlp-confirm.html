<!DOCTYPE html>
<html lang="ko" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Sync v2 - 자연어 명령 확인 UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    [x-cloak] { display: none !important; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes typing { from { width: 0; } to { width: 100%; } }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300">

<div x-data="nlpConfirmDemo()" class="min-h-screen flex items-center justify-center p-4">

  <!-- 챗봇 패널 시뮬레이션 -->
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 w-full max-w-sm overflow-hidden">
    <!-- 헤더 -->
    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-4 py-3 flex items-center gap-2">
      <div class="w-7 h-7 bg-white/20 rounded-full flex items-center justify-center">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
      </div>
      <div>
        <p class="text-sm font-medium text-white">CS 어시스턴트</p>
        <p class="text-[10px] text-indigo-200">자연어 명령 모드</p>
      </div>
    </div>

    <!-- 메시지 영역 -->
    <div class="h-[480px] p-4 overflow-y-auto bg-gray-50 dark:bg-gray-900 space-y-4">
      <template x-for="(msg, idx) in conversation" :key="idx">
        <div>
          <!-- 사용자 메시지 -->
          <div x-show="msg.role === 'user'" class="flex justify-end mb-2">
            <div class="bg-indigo-600 text-white rounded-xl rounded-br-sm px-3 py-2 max-w-[85%]">
              <p class="text-sm" x-text="msg.text"></p>
            </div>
          </div>

          <!-- AI 메시지 (텍스트) -->
          <div x-show="msg.role === 'ai' && msg.type === 'text'" class="flex gap-2 mb-2">
            <div class="w-7 h-7 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full flex items-center justify-center flex-shrink-0">
              <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-xl rounded-tl-sm px-3 py-2 max-w-[85%] shadow-sm border border-gray-100 dark:border-gray-700">
              <p class="text-sm text-gray-700 dark:text-gray-200" x-text="msg.text"></p>
            </div>
          </div>

          <!-- AI 확인 카드 (쓰기 명령) -->
          <div x-show="msg.role === 'ai' && msg.type === 'confirm'" class="flex gap-2 mb-2 fade-in">
            <div class="w-7 h-7 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full flex items-center justify-center flex-shrink-0">
              <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-xl rounded-tl-sm shadow-sm border border-gray-100 dark:border-gray-700 max-w-[85%] overflow-hidden">
              <div class="px-3 py-2">
                <p class="text-sm text-gray-700 dark:text-gray-200" x-text="msg.question"></p>
              </div>
              <!-- 확인 카드 -->
              <div class="mx-3 mb-3 bg-gray-50 dark:bg-gray-900 rounded-lg border border-gray-200 dark:border-gray-700 p-3">
                <template x-for="field in msg.fields" :key="field.label">
                  <div class="flex items-center justify-between py-1">
                    <span class="text-xs text-gray-500 dark:text-gray-400" x-text="field.label"></span>
                    <span class="text-xs font-medium" x-text="field.value"></span>
                  </div>
                </template>
              </div>
              <!-- 버튼 -->
              <div class="px-3 pb-3 flex gap-2" x-show="!msg.resolved">
                <button @click="resolveConfirm(msg, 'execute')" class="flex-1 px-2.5 py-1.5 text-xs bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium" x-text="msg.executeLabel || '생성하기'"></button>
                <button @click="resolveConfirm(msg, 'edit')" class="px-2.5 py-1.5 text-xs text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">수정하기</button>
                <button @click="resolveConfirm(msg, 'cancel')" class="px-2.5 py-1.5 text-xs text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 rounded-lg">취소</button>
              </div>
              <!-- 실행 결과 -->
              <div x-show="msg.resolved" class="px-3 pb-3">
                <div class="flex items-center gap-1.5 text-xs" :class="msg.resultClass">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                  <span x-text="msg.resultText"></span>
                </div>
              </div>
            </div>
          </div>

          <!-- AI 읽기 응답 (즉시, 확인 불필요) -->
          <div x-show="msg.role === 'ai' && msg.type === 'query'" class="flex gap-2 mb-2">
            <div class="w-7 h-7 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full flex items-center justify-center flex-shrink-0">
              <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-xl rounded-tl-sm px-3 py-2 max-w-[85%] shadow-sm border border-gray-100 dark:border-gray-700">
              <p class="text-sm text-gray-700 dark:text-gray-200" x-html="msg.text"></p>
              <div x-show="msg.link" class="mt-2">
                <button class="text-xs text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                  <span x-text="msg.link"></span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- 입력창 -->
    <div class="px-3 py-2 border-t border-gray-200 dark:border-gray-700">
      <div class="flex items-center gap-2">
        <input type="text" x-model="input" @keydown.enter="sendDemo()" placeholder="자연어로 명령하세요..." class="flex-1 px-3 py-2 text-sm bg-gray-100 dark:bg-gray-700 rounded-lg border-0 focus:ring-2 focus:ring-indigo-500 outline-none">
        <button @click="sendDemo()" class="p-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 시나리오 컨트롤 -->
  <div class="fixed top-4 right-4 z-50 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-lg p-3 max-w-[200px]">
    <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-2">시나리오</p>
    <div class="space-y-1">
      <button @click="loadScenario('create')" class="w-full text-left px-2 py-1 text-xs text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded">업무 생성</button>
      <button @click="loadScenario('complete')" class="w-full text-left px-2 py-1 text-xs text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded">업무 완료</button>
      <button @click="loadScenario('query')" class="w-full text-left px-2 py-1 text-xs text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded">조회 (확인 불필요)</button>
      <button @click="loadScenario('checkin')" class="w-full text-left px-2 py-1 text-xs text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded">출근</button>
      <button @click="loadScenario('error')" class="w-full text-left px-2 py-1 text-xs text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded">에러 (대상 못찾음)</button>
      <div class="pt-1 mt-1 border-t border-gray-200 dark:border-gray-700">
        <button @click="$el.closest('html')?.classList.toggle('dark')" class="w-full text-left px-2 py-1 text-xs text-gray-400 rounded">다크모드</button>
      </div>
    </div>
  </div>
</div>

<script>
function nlpConfirmDemo() {
  return {
    conversation: [],
    input: '',

    init() { this.loadScenario('create'); },

    loadScenario(type) {
      if (type === 'create') {
        this.conversation = [
          { role: 'user', text: '내일까지 디자인 시안 업무 만들어줘' },
          { role: 'ai', type: 'confirm', question: '다음 업무를 생성할까요?',
            fields: [
              { label: '업무명', value: '디자인 시안' },
              { label: '프로젝트', value: 'A사 웹사이트 (현재 화면)' },
              { label: '마감일', value: '2026-03-17 (내일)' },
              { label: '우선순위', value: '보통' },
              { label: '담당자', value: '김매니저 (본인)' }
            ],
            executeLabel: '생성하기', resolved: false, resultClass: '', resultText: '' }
        ];
      } else if (type === 'complete') {
        this.conversation = [
          { role: 'user', text: '디자인 시안 완료 처리해' },
          { role: 'ai', type: 'confirm', question: '이 업무를 완료 처리할까요?',
            fields: [
              { label: '업무명', value: '디자인 시안 v3' },
              { label: '프로젝트', value: '홈페이지 리뉴얼' },
              { label: '현재 상태', value: '진행 중 → 완료' }
            ],
            executeLabel: '완료 처리', resolved: false, resultClass: '', resultText: '' }
        ];
      } else if (type === 'query') {
        this.conversation = [
          { role: 'user', text: '오늘 마감 업무 뭐야?' },
          { role: 'ai', type: 'query', text: '오늘 마감 업무는 <strong>2건</strong>입니다:<br><br>1. 디자인 시안 v3 — 홈페이지 리뉴얼<br>2. 기획서 최종 검토 — ERP 구축', link: '내 업무에서 보기' },
          { role: 'user', text: 'A사 연락처 알려줘' },
          { role: 'ai', type: 'query', text: '<strong>A사 (테크솔루션)</strong><br>담당자: 박상무<br>전화: 02-1234-5678<br>이메일: park@techsolution.co.kr', link: '발주처 상세 보기' }
        ];
      } else if (type === 'checkin') {
        this.conversation = [
          { role: 'user', text: '출근' },
          { role: 'ai', type: 'text', text: '출근이 기록되었습니다! ⏰ 09:02 — 좋은 하루 되세요 😊' }
        ];
      } else if (type === 'error') {
        this.conversation = [
          { role: 'user', text: 'B 프로젝트에 업무 추가해줘' },
          { role: 'ai', type: 'text', text: '\'B 프로젝트\'를 찾을 수 없어요. 혹시 아래 중 하나를 말씀하시나요?\n\n• B사 리뉴얼 프로젝트\n• 브랜딩 프로젝트' },
          { role: 'user', text: 'B사 리뉴얼' },
          { role: 'ai', type: 'confirm', question: 'B사 리뉴얼 프로젝트에 업무를 추가할까요?',
            fields: [
              { label: '업무명', value: '(업무명을 알려주세요)' },
              { label: '프로젝트', value: 'B사 리뉴얼' }
            ],
            executeLabel: '생성하기', resolved: false, resultClass: '', resultText: '' }
        ];
      }
    },

    resolveConfirm(msg, action) {
      if (action === 'execute') {
        msg.resolved = true;
        msg.resultClass = 'text-green-600 dark:text-green-400';
        msg.resultText = msg.executeLabel === '완료 처리' ? '업무가 완료 처리되었어요! ✅' : '업무가 생성되었어요! 업무 보기 →';
      } else if (action === 'cancel') {
        msg.resolved = true;
        msg.resultClass = 'text-gray-500 dark:text-gray-400';
        msg.resultText = '취소했습니다';
      } else if (action === 'edit') {
        this.conversation.push({ role: 'ai', type: 'text', text: '어떤 항목을 수정할까요? (예: 마감일 금요일로 변경)' });
      }
    },

    sendDemo() {
      if (!this.input.trim()) return;
      this.conversation.push({ role: 'user', text: this.input });
      this.input = '';
    }
  }
}
</script>
</body>
</html>
