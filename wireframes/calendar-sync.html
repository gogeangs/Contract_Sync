<!DOCTYPE html>
<html lang="ko" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Sync v2 - Google 캘린더 연동</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
    .pulse-ring { animation: pulse-ring 1.5s ease-out infinite; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300">

<div x-data="appLayout()" class="flex h-screen overflow-hidden">

  <!-- 좌측 사이드바 -->
  <aside class="hidden lg:flex lg:flex-col w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 fixed inset-y-0 left-0 z-30">
    <div class="flex items-center gap-3 px-6 py-5 border-b border-gray-200 dark:border-gray-700">
      <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      </div>
      <span class="text-lg font-bold text-gray-800 dark:text-white">Contract Sync</span>
    </div>
    <div class="px-4 py-3">
      <button class="w-full flex items-center justify-between px-3 py-2 text-sm bg-gray-50 dark:bg-gray-700 rounded-lg">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span class="text-gray-700 dark:text-gray-200">디자인팀</span>
        </div>
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>
    </div>
    <nav class="flex-1 px-3 py-2 space-y-1 overflow-y-auto">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>대시보드</span>
      </a>
      <a href="projects.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
        <span>프로젝트</span>
      </a>
      <a href="tasks.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
        <span>업무</span>
      </a>
      <a href="settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-medium text-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span>설정</span>
      </a>
    </nav>
    <div class="px-4 py-3 border-t border-gray-200 dark:border-gray-700">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-indigo-100 dark:bg-indigo-900 rounded-full flex items-center justify-center">
          <span class="text-sm font-medium text-indigo-600 dark:text-indigo-400">김</span>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium truncate">김매니저</p>
          <p class="text-xs text-gray-500 dark:text-gray-400 truncate">pm@company.com</p>
        </div>
        <button @click="darkMode = !darkMode; $el.closest('html')?.classList.toggle('dark')" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
          <svg x-show="!darkMode" class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          <svg x-show="darkMode" x-cloak class="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- 모바일 오버레이 -->
  <div x-show="mobileMenuOpen" x-cloak @click="mobileMenuOpen = false" class="fixed inset-0 bg-black/50 z-40 lg:hidden"></div>

  <!-- 메인 콘텐츠 -->
  <div class="flex-1 flex flex-col lg:ml-64 min-h-screen">
    <header class="sticky top-0 z-20 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
      <div class="flex items-center justify-between px-4 lg:px-6 py-3">
        <div class="flex items-center gap-3">
          <button @click="mobileMenuOpen = true" class="lg:hidden p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div>
            <div class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400">
              <a href="settings.html" class="hover:text-indigo-600 dark:hover:text-indigo-400">설정</a>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              <span class="text-gray-800 dark:text-gray-200 font-medium">Google 캘린더 연동</span>
            </div>
            <h1 class="text-lg font-bold mt-0.5">Google 캘린더 동기화</h1>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-1 p-4 lg:p-6 pb-20 lg:pb-6" x-data="calendarSyncPage()">

      <!-- 연동 상태에 따른 분기 -->
      <template x-if="!isConnected">
        <!-- 미연동 상태 — 연동 시작 카드 -->
        <div class="max-w-lg mx-auto mt-8">
          <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-8 text-center">
            <!-- Google Calendar 아이콘 -->
            <div class="w-20 h-20 mx-auto bg-white dark:bg-gray-700 rounded-2xl shadow-lg flex items-center justify-center mb-6 border border-gray-100 dark:border-gray-600">
              <svg class="w-12 h-12" viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" fill="#4285F4"/>
                <rect x="3" y="4" width="18" height="5" rx="2" fill="#1967D2"/>
                <rect x="7" y="11" width="4" height="3" rx="0.5" fill="white" opacity="0.9"/>
                <rect x="13" y="11" width="4" height="3" rx="0.5" fill="white" opacity="0.9"/>
                <rect x="7" y="16" width="4" height="3" rx="0.5" fill="white" opacity="0.9"/>
                <rect x="13" y="16" width="4" height="3" rx="0.5" fill="white" opacity="0.9"/>
              </svg>
            </div>

            <h2 class="text-xl font-bold mb-2">Google 캘린더를 연동하세요</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-6 leading-relaxed">
              업무 마감일과 일정을 Google 캘린더와 자동으로 동기화합니다.<br>
              동기화 방향을 선택하여 원하는 방식으로 연동할 수 있습니다.
            </p>

            <!-- 동기화 방향 선택 -->
            <div class="space-y-3 mb-6 text-left">
              <label class="block text-sm font-medium mb-2">동기화 방향 선택</label>

              <label class="flex items-start gap-3 p-3 border rounded-xl cursor-pointer transition-all" :class="selectedDirection === 'cs_to_google' ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20 dark:border-indigo-400' : 'border-gray-200 dark:border-gray-600 hover:border-gray-300 dark:hover:border-gray-500'">
                <input type="radio" x-model="selectedDirection" value="cs_to_google" class="mt-1 accent-indigo-600">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="text-sm font-medium">Contract Sync → Google</span>
                    <span class="text-[10px] px-1.5 py-0.5 bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 rounded-full">추천</span>
                  </div>
                  <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">업무 마감일/일정을 Google 캘린더에 자동 등록합니다</p>
                </div>
              </label>

              <label class="flex items-start gap-3 p-3 border rounded-xl cursor-pointer transition-all" :class="selectedDirection === 'google_to_cs' ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20 dark:border-indigo-400' : 'border-gray-200 dark:border-gray-600 hover:border-gray-300 dark:hover:border-gray-500'">
                <input type="radio" x-model="selectedDirection" value="google_to_cs" class="mt-1 accent-indigo-600">
                <div>
                  <span class="text-sm font-medium">Google → Contract Sync</span>
                  <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">Google 캘린더의 일정을 업무로 가져옵니다</p>
                </div>
              </label>

              <label class="flex items-start gap-3 p-3 border rounded-xl cursor-pointer transition-all" :class="selectedDirection === 'bidirectional' ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20 dark:border-indigo-400' : 'border-gray-200 dark:border-gray-600 hover:border-gray-300 dark:hover:border-gray-500'">
                <input type="radio" x-model="selectedDirection" value="bidirectional" class="mt-1 accent-indigo-600">
                <div>
                  <span class="text-sm font-medium">양방향 동기화</span>
                  <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">양쪽 변경사항을 서로 자동 반영합니다</p>
                </div>
              </label>
            </div>

            <!-- Google 로그인 버튼 -->
            <button @click="connectGoogle()" class="w-full flex items-center justify-center gap-3 px-6 py-3 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors shadow-sm">
              <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
              <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Google 계정으로 연동하기</span>
            </button>

            <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-4">연동 시 캘린더 읽기/쓰기 권한이 필요합니다. 언제든 해제할 수 있습니다.</p>
          </div>
        </div>
      </template>

      <template x-if="isConnected">
        <div class="max-w-2xl mx-auto space-y-6">

          <!-- 연동 상태 카드 -->
          <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 overflow-hidden">
            <div class="p-5">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                  <!-- Google Calendar 아이콘 + 상태 -->
                  <div class="relative">
                    <div class="w-14 h-14 bg-white dark:bg-gray-700 rounded-xl shadow flex items-center justify-center border border-gray-100 dark:border-gray-600">
                      <svg class="w-8 h-8" viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="18" rx="2" fill="#4285F4"/>
                        <rect x="3" y="4" width="18" height="5" rx="2" fill="#1967D2"/>
                        <rect x="7" y="11" width="4" height="3" rx="0.5" fill="white" opacity="0.9"/>
                        <rect x="13" y="11" width="4" height="3" rx="0.5" fill="white" opacity="0.9"/>
                        <rect x="7" y="16" width="4" height="3" rx="0.5" fill="white" opacity="0.9"/>
                      </svg>
                    </div>
                    <div class="absolute -bottom-1 -right-1 w-5 h-5 bg-green-500 rounded-full flex items-center justify-center border-2 border-white dark:border-gray-800">
                      <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                    </div>
                  </div>
                  <div>
                    <h3 class="font-semibold">Google 캘린더</h3>
                    <p class="text-sm text-gray-500 dark:text-gray-400">pm@company.com</p>
                    <div class="flex items-center gap-2 mt-1">
                      <span class="inline-flex items-center gap-1 text-xs text-green-600 dark:text-green-400">
                        <span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span>
                        연동됨
                      </span>
                      <span class="text-xs text-gray-400 dark:text-gray-500">· 마지막 동기화: <span x-text="lastSyncedAt"></span></span>
                    </div>
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <button @click="syncNow()" :disabled="isSyncing" class="px-3 py-2 text-sm text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 rounded-lg transition-colors flex items-center gap-1.5 disabled:opacity-50">
                    <svg class="w-4 h-4" :class="{ 'spin': isSyncing }" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    <span x-text="isSyncing ? '동기화 중...' : '지금 동기화'"></span>
                  </button>
                  <button @click="showDisconnect = true" class="px-3 py-2 text-sm text-red-500 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors">
                    연동 해제
                  </button>
                </div>
              </div>
            </div>

            <!-- 동기화 결과 토스트 -->
            <div x-show="syncResult" x-cloak x-transition class="mx-5 mb-4 p-3 rounded-lg text-sm flex items-center gap-2" :class="syncResult === 'success' ? 'bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-300' : 'bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-300'">
              <svg x-show="syncResult === 'success'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
              <span x-text="syncResult === 'success' ? '동기화 완료 — 3건 업데이트됨' : '동기화 실패 — 다시 시도해주세요'"></span>
            </div>
          </div>

          <!-- 동기화 방향 설정 -->
          <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-5">
            <h3 class="text-sm font-semibold mb-4">동기화 방향</h3>

            <div class="space-y-3">
              <template x-for="opt in directionOptions" :key="opt.value">
                <label class="flex items-start gap-3 p-4 border rounded-xl cursor-pointer transition-all" :class="syncDirection === opt.value ? 'border-indigo-500 bg-indigo-50/50 dark:bg-indigo-900/10 dark:border-indigo-400' : 'border-gray-200 dark:border-gray-600 hover:border-gray-300 dark:hover:border-gray-500'">
                  <input type="radio" x-model="syncDirection" :value="opt.value" @change="changeDirection(opt.value)" class="mt-0.5 accent-indigo-600">
                  <div class="flex-1">
                    <div class="flex items-center gap-2">
                      <!-- 방향 아이콘 -->
                      <div class="flex items-center gap-1.5">
                        <div class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold" :class="opt.fromBg" x-text="opt.fromIcon"></div>
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <template x-if="opt.value === 'bidirectional'">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
                          </template>
                          <template x-if="opt.value !== 'bidirectional'">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                          </template>
                        </svg>
                        <div class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold" :class="opt.toBg" x-text="opt.toIcon"></div>
                      </div>
                      <span class="text-sm font-medium ml-1" x-text="opt.label"></span>
                    </div>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1" x-text="opt.desc"></p>
                  </div>
                </label>
              </template>
            </div>
          </div>

          <!-- 동기화 대상 항목 -->
          <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-5">
            <h3 class="text-sm font-semibold mb-4">동기화 항목</h3>
            <div class="space-y-3">
              <template x-for="item in syncItems" :key="item.id">
                <div class="flex items-center justify-between py-2">
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg flex items-center justify-center" :class="item.iconBg">
                      <span x-text="item.icon" class="text-base"></span>
                    </div>
                    <div>
                      <p class="text-sm font-medium" x-text="item.name"></p>
                      <p class="text-xs text-gray-500 dark:text-gray-400" x-text="item.desc"></p>
                    </div>
                  </div>
                  <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" :checked="item.enabled" @change="item.enabled = !item.enabled" class="sr-only peer">
                    <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-indigo-300 dark:peer-focus:ring-indigo-800 rounded-full peer dark:bg-gray-600 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:border-gray-600 peer-checked:bg-indigo-600"></div>
                  </label>
                </div>
              </template>
            </div>
          </div>

          <!-- 최근 동기화 이력 -->
          <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-5">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-sm font-semibold">동기화 이력</h3>
              <span class="text-xs text-gray-400 dark:text-gray-500">최근 7일</span>
            </div>
            <div class="space-y-3">
              <template x-for="log in syncLogs" :key="log.id">
                <div class="flex items-center gap-3">
                  <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0" :class="log.success ? 'bg-green-100 dark:bg-green-900/30' : 'bg-red-100 dark:bg-red-900/30'">
                    <svg x-show="log.success" class="w-4 h-4 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    <svg x-show="!log.success" class="w-4 h-4 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                  </div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2">
                      <p class="text-sm" x-text="log.message"></p>
                      <span class="text-[10px] px-1.5 py-0.5 rounded-full" :class="log.dirBadge" x-text="log.dirLabel"></span>
                    </div>
                    <p class="text-xs text-gray-400 dark:text-gray-500" x-text="log.time"></p>
                  </div>
                  <span class="text-xs text-gray-500 dark:text-gray-400 flex-shrink-0" x-text="log.count"></span>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>

      <!-- 연동 해제 확인 모달 -->
      <div x-show="showDisconnect" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4" x-transition>
        <div class="absolute inset-0 bg-black/50" @click="showDisconnect = false"></div>
        <div class="relative bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-sm p-6 fade-in">
          <div class="text-center">
            <div class="w-12 h-12 bg-red-100 dark:bg-red-900/30 rounded-full flex items-center justify-center mx-auto mb-4">
              <svg class="w-6 h-6 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
            </div>
            <h3 class="text-lg font-bold mb-2">Google 캘린더 연동 해제</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400">연동을 해제하면 캘린더 동기화가 중단됩니다.<br>기존에 동기화된 일정은 유지됩니다.</p>
          </div>
          <div class="flex gap-2 mt-6">
            <button @click="showDisconnect = false" class="flex-1 px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">취소</button>
            <button @click="disconnect()" class="flex-1 px-4 py-2 text-sm bg-red-600 hover:bg-red-700 text-white rounded-lg transition-colors">연동 해제</button>
          </div>
        </div>
      </div>

    </main>

    <!-- 모바일 하단 탭 바 -->
    <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 z-30">
      <div class="flex justify-around py-2">
        <a href="dashboard.html" class="flex flex-col items-center gap-1 px-3 py-1 text-gray-400 dark:text-gray-500">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          <span class="text-[10px]">홈</span>
        </a>
        <a href="projects.html" class="flex flex-col items-center gap-1 px-3 py-1 text-gray-400 dark:text-gray-500">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
          <span class="text-[10px]">프로젝트</span>
        </a>
        <a href="tasks.html" class="flex flex-col items-center gap-1 px-3 py-1 text-gray-400 dark:text-gray-500">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
          <span class="text-[10px]">업무</span>
        </a>
        <a href="settings.html" class="flex flex-col items-center gap-1 px-3 py-1 text-indigo-600 dark:text-indigo-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span class="text-[10px] font-medium">설정</span>
        </a>
      </div>
    </nav>
  </div>
</div>

<script>
function appLayout() {
  return {
    mobileMenuOpen: false,
    darkMode: false,
    init() {
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        this.darkMode = true;
        document.documentElement.classList.add('dark');
      }
    }
  }
}

function calendarSyncPage() {
  return {
    isConnected: true, // false로 변경하면 미연동 상태 표시
    selectedDirection: 'cs_to_google',
    syncDirection: 'bidirectional',
    isSyncing: false,
    syncResult: null,
    showDisconnect: false,
    lastSyncedAt: '5분 전',

    directionOptions: [
      {
        value: 'cs_to_google',
        label: 'Contract Sync → Google',
        desc: '업무 마감일과 일정이 Google 캘린더에 자동 등록됩니다',
        fromIcon: 'CS', fromBg: 'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400',
        toIcon: 'G', toBg: 'bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400'
      },
      {
        value: 'google_to_cs',
        label: 'Google → Contract Sync',
        desc: 'Google 캘린더의 일정을 업무로 가져옵니다',
        fromIcon: 'G', fromBg: 'bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400',
        toIcon: 'CS', toBg: 'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400'
      },
      {
        value: 'bidirectional',
        label: '양방향 동기화',
        desc: '양쪽의 변경사항을 실시간으로 서로 반영합니다',
        fromIcon: 'CS', fromBg: 'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400',
        toIcon: 'G', toBg: 'bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400'
      }
    ],

    syncItems: [
      { id: 1, name: '업무 마감일', desc: '업무의 마감일을 캘린더 이벤트로 등록', icon: '📋', iconBg: 'bg-blue-50 dark:bg-blue-900/20', enabled: true },
      { id: 2, name: '프로젝트 일정', desc: '프로젝트 시작일/종료일 동기화', icon: '📁', iconBg: 'bg-purple-50 dark:bg-purple-900/20', enabled: true },
      { id: 3, name: '미팅/회의', desc: 'Google 캘린더 회의 일정 가져오기', icon: '🤝', iconBg: 'bg-green-50 dark:bg-green-900/20', enabled: false },
      { id: 4, name: '리마인더', desc: '마감 D-1, D-3 자동 리마인더', icon: '⏰', iconBg: 'bg-amber-50 dark:bg-amber-900/20', enabled: true }
    ],

    syncLogs: [
      { id: 1, message: '양방향 동기화 완료', time: '오늘 14:30', count: '3건', success: true, dirLabel: '양방향', dirBadge: 'bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300' },
      { id: 2, message: 'CS → Google 동기화 완료', time: '오늘 09:00', count: '5건', success: true, dirLabel: 'CS→G', dirBadge: 'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300' },
      { id: 3, message: 'Google → CS 동기화 완료', time: '어제 18:00', count: '2건', success: true, dirLabel: 'G→CS', dirBadge: 'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300' },
      { id: 4, message: '토큰 만료 — 재인증 필요', time: '3월 13일 10:00', count: '-', success: false, dirLabel: '오류', dirBadge: 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300' },
      { id: 5, message: 'CS → Google 동기화 완료', time: '3월 12일 09:00', count: '8건', success: true, dirLabel: 'CS→G', dirBadge: 'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300' }
    ],

    connectGoogle() {
      // 시뮬레이션: Google OAuth 후 연동 완료
      this.isConnected = true;
      this.syncDirection = this.selectedDirection;
    },

    syncNow() {
      this.isSyncing = true;
      this.syncResult = null;
      setTimeout(() => {
        this.isSyncing = false;
        this.syncResult = 'success';
        this.lastSyncedAt = '방금 전';
        setTimeout(() => { this.syncResult = null; }, 3000);
      }, 2000);
    },

    changeDirection(dir) {
      this.syncDirection = dir;
      // API: PATCH /calendar/{id}/direction
    },

    disconnect() {
      this.isConnected = false;
      this.showDisconnect = false;
    }
  }
}
</script>
</body>
</html>
