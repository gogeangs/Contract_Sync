<!DOCTYPE html>
<html lang="ko" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Sync v2 - 대시보드 캘린더</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300">
<div x-data="appLayout()" class="flex h-screen overflow-hidden">
  <aside class="hidden lg:flex lg:flex-col w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 fixed inset-y-0 left-0 z-30">
    <div class="flex items-center gap-3 px-6 py-5 border-b border-gray-200 dark:border-gray-700"><div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div><span class="text-lg font-bold dark:text-white">Contract Sync</span></div>
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-medium text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>대시보드</span></a>
      <a href="board-list.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg><span>게시판</span></a>
      <a href="projects.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg><span>프로젝트</span></a>
      <a href="my-tasks.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg><span>내 업무</span></a>
      <a href="my-attendance.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span>근태</span></a>
    </nav>
    <div class="px-4 py-3 border-t border-gray-200 dark:border-gray-700"><div class="flex items-center gap-3"><div class="w-8 h-8 bg-indigo-100 dark:bg-indigo-900 rounded-full flex items-center justify-center"><span class="text-sm font-medium text-indigo-600 dark:text-indigo-400">김</span></div><div class="flex-1 min-w-0"><p class="text-sm font-medium truncate">김매니저</p></div><button @click="darkMode=!darkMode;document.documentElement.classList.toggle('dark')" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><svg x-show="!darkMode" class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg><svg x-show="darkMode" x-cloak class="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button></div></div>
  </aside>
  <div x-show="mobileMenuOpen" x-cloak @click="mobileMenuOpen=false" class="fixed inset-0 bg-black/50 z-40 lg:hidden"></div>
  <div class="flex-1 flex flex-col lg:ml-64 min-h-screen">
    <header class="sticky top-0 z-20 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
      <div class="flex items-center justify-between px-4 lg:px-6 py-3">
        <div class="flex items-center gap-3">
          <button @click="mobileMenuOpen=true" class="lg:hidden p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <h1 class="text-lg font-bold">대시보드</h1>
        </div>
      </div>
    </header>
    <main class="flex-1 p-4 lg:p-6 pb-20 lg:pb-6" x-data="calendarWidget()">
      <!-- 출퇴근 위젯 (간략) -->
      <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4 mb-6">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-green-100 dark:bg-green-900/30 rounded-lg flex items-center justify-center"><svg class="w-5 h-5 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
            <div><p class="text-sm font-medium">근무 중</p><p class="text-xs text-gray-500 dark:text-gray-400">출근 09:02 · 4시간 12분 경과</p></div>
          </div>
          <button class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white text-sm rounded-lg">퇴근</button>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- 캘린더 위젯 -->
        <div class="lg:col-span-2 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700">
          <!-- 캘린더 헤더 -->
          <div class="px-5 py-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <button @click="prevMonth()" class="p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></button>
              <h3 class="text-base font-bold" x-text="year+'년 '+month+'월'"></h3>
              <button @click="nextMonth()" class="p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></button>
            </div>
            <button @click="goToday()" class="px-3 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">오늘</button>
          </div>
          <!-- 요일 헤더 -->
          <div class="grid grid-cols-7 text-center text-xs font-medium text-gray-500 dark:text-gray-400 border-b border-gray-100 dark:border-gray-700">
            <template x-for="d in ['일','월','화','수','목','금','토']"><div class="py-2" :class="d==='일'?'text-red-400':d==='토'?'text-blue-400':''" x-text="d"></div></template>
          </div>
          <!-- 날짜 그리드 -->
          <div class="grid grid-cols-7">
            <template x-for="(day, idx) in calendarDays" :key="idx">
              <div @click="day.date && (selectedDate=day.date)" class="min-h-[80px] lg:min-h-[100px] p-1.5 border-b border-r border-gray-100 dark:border-gray-700 cursor-pointer transition-colors" :class="{
                'bg-indigo-50 dark:bg-indigo-900/20': day.date===selectedDate,
                'hover:bg-gray-50 dark:hover:bg-gray-700/30': day.date && day.date!==selectedDate,
                'bg-gray-50/50 dark:bg-gray-900/30': !day.currentMonth
              }">
                <div class="flex items-center justify-between mb-1">
                  <span class="text-xs font-medium" :class="{
                    'text-gray-300 dark:text-gray-600': !day.currentMonth,
                    'text-red-400': day.dayOfWeek===0 && day.currentMonth,
                    'text-blue-400': day.dayOfWeek===6 && day.currentMonth,
                    'bg-indigo-600 text-white rounded-full w-5 h-5 flex items-center justify-center': day.isToday
                  }" x-text="day.num"></span>
                </div>
                <!-- 이벤트 도트 -->
                <div class="space-y-0.5">
                  <template x-for="evt in (day.events||[]).slice(0,2)" :key="evt.id">
                    <div class="text-[10px] px-1 py-0.5 rounded truncate" :class="evt.color" x-text="evt.title"></div>
                  </template>
                  <div x-show="(day.events||[]).length>2" class="text-[10px] text-gray-400 px-1" x-text="'+'+ ((day.events||[]).length-2)+'건'"></div>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- 선택된 날짜 상세 -->
        <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700">
          <div class="px-5 py-4 border-b border-gray-200 dark:border-gray-700">
            <h3 class="text-sm font-semibold" x-text="selectedDate ? selectedDate + ' 일정' : '날짜를 선택하세요'"></h3>
          </div>
          <div class="p-4 space-y-3" x-show="selectedDateEvents.length>0">
            <template x-for="evt in selectedDateEvents" :key="evt.id">
              <div class="flex items-start gap-3 p-3 rounded-lg bg-gray-50 dark:bg-gray-900">
                <div class="w-1 h-full rounded-full self-stretch" :class="evt.dotColor"></div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-medium" x-text="evt.title"></p>
                  <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5" x-text="evt.project"></p>
                  <div class="flex items-center gap-2 mt-1">
                    <span class="text-[10px] px-1.5 py-0.5 rounded-full" :class="evt.typeBadge" x-text="evt.type"></span>
                    <span class="text-[10px] text-gray-400" x-text="evt.assignee"></span>
                  </div>
                </div>
              </div>
            </template>
          </div>
          <div class="p-8 text-center" x-show="selectedDateEvents.length===0">
            <svg class="w-12 h-12 text-gray-300 dark:text-gray-600 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <p class="text-sm text-gray-400 dark:text-gray-500 mt-3">이 날짜에 일정이 없습니다</p>
          </div>
          <!-- 범례 -->
          <div class="px-5 py-3 border-t border-gray-200 dark:border-gray-700">
            <p class="text-[10px] text-gray-400 dark:text-gray-500 mb-2 font-medium">범례</p>
            <div class="flex flex-wrap gap-3">
              <div class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-red-400"></div><span class="text-[10px] text-gray-500">마감일</span></div>
              <div class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-blue-400"></div><span class="text-[10px] text-gray-500">시작일</span></div>
              <div class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-green-400"></div><span class="text-[10px] text-gray-500">완료</span></div>
              <div class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-amber-400"></div><span class="text-[10px] text-gray-500">피드백</span></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script>
function appLayout(){return{mobileMenuOpen:false,darkMode:false,init(){if(window.matchMedia('(prefers-color-scheme:dark)').matches){this.darkMode=true;document.documentElement.classList.add('dark')}}}}
function calendarWidget(){return{
  year:2026,month:3,selectedDate:'2026-03-15',
  events:[
    {id:1,date:'2026-03-03',title:'홈페이지 시안 시작',project:'홈페이지 리뉴얼',type:'시작',assignee:'박디자이너',color:'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300',dotColor:'bg-blue-400',typeBadge:'bg-blue-100 dark:bg-blue-900/30 text-blue-600'},
    {id:2,date:'2026-03-07',title:'시안 v3 마감',project:'홈페이지 리뉴얼',type:'마감',assignee:'박디자이너',color:'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300',dotColor:'bg-red-400',typeBadge:'bg-red-100 dark:bg-red-900/30 text-red-600'},
    {id:3,date:'2026-03-10',title:'개발 착수',project:'홈페이지 리뉴얼',type:'시작',assignee:'최개발',color:'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300',dotColor:'bg-blue-400',typeBadge:'bg-blue-100 dark:bg-blue-900/30 text-blue-600'},
    {id:4,date:'2026-03-15',title:'ERP 기획 마감',project:'ERP 시스템 구축',type:'마감',assignee:'김매니저',color:'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300',dotColor:'bg-red-400',typeBadge:'bg-red-100 dark:bg-red-900/30 text-red-600'},
    {id:5,date:'2026-03-15',title:'쇼핑몰 피드백 대기',project:'쇼핑몰 앱',type:'피드백',assignee:'정과장',color:'bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300',dotColor:'bg-amber-400',typeBadge:'bg-amber-100 dark:bg-amber-900/30 text-amber-600'},
    {id:6,date:'2026-03-18',title:'개발 완료 예정',project:'홈페이지 리뉴얼',type:'마감',assignee:'최개발',color:'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300',dotColor:'bg-red-400',typeBadge:'bg-red-100 dark:bg-red-900/30 text-red-600'},
    {id:7,date:'2026-03-20',title:'검수 시작',project:'홈페이지 리뉴얼',type:'시작',assignee:'김매니저',color:'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300',dotColor:'bg-blue-400',typeBadge:'bg-blue-100 dark:bg-blue-900/30 text-blue-600'},
    {id:8,date:'2026-03-25',title:'납품 마감',project:'홈페이지 리뉴얼',type:'마감',assignee:'김매니저',color:'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300',dotColor:'bg-red-400',typeBadge:'bg-red-100 dark:bg-red-900/30 text-red-600'},
    {id:9,date:'2026-03-12',title:'디자인 완료',project:'브랜딩 프로젝트',type:'완료',assignee:'이디자이너',color:'bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-300',dotColor:'bg-green-400',typeBadge:'bg-green-100 dark:bg-green-900/30 text-green-600'},
  ],
  get calendarDays(){
    const first=new Date(this.year,this.month-1,1);
    const last=new Date(this.year,this.month,0);
    const startDay=first.getDay();
    const days=[];
    // prev month
    const prevLast=new Date(this.year,this.month-1,0);
    for(let i=startDay-1;i>=0;i--){const d=prevLast.getDate()-i;days.push({num:d,currentMonth:false,dayOfWeek:(startDay-1-i)%7})}
    // current month
    for(let d=1;d<=last.getDate();d++){
      const dt=new Date(this.year,this.month-1,d);
      const dateStr=this.year+'-'+String(this.month).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      days.push({num:d,currentMonth:true,dayOfWeek:dt.getDay(),date:dateStr,isToday:dateStr==='2026-03-15',events:this.events.filter(e=>e.date===dateStr)});
    }
    // next month
    const remaining=42-days.length;
    for(let d=1;d<=remaining;d++){days.push({num:d,currentMonth:false,dayOfWeek:(first.getDay()+last.getDate()+d-1)%7})}
    return days;
  },
  get selectedDateEvents(){return this.events.filter(e=>e.date===this.selectedDate)},
  prevMonth(){if(this.month===1){this.month=12;this.year--}else this.month--},
  nextMonth(){if(this.month===12){this.month=1;this.year++}else this.month++},
  goToday(){this.year=2026;this.month=3;this.selectedDate='2026-03-15'}
}}
</script>
</body>
</html>
