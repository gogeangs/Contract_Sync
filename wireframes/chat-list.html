    <div class="px-4 py-3 border-t border-gray-200 dark:border-gray-700"><div class="flex items-center gap-3"><div class="w-8 h-8 bg-indigo-100 dark:bg-indigo-900 rounded-full flex items-center justify-center"><span class="text-sm font-medium text-indigo-600 dark:text-indigo-400">김</span></div><div class="flex-1"><p class="text-sm font-medium truncate">김매니저</p></div><button @click="darkMode=!darkMode;document.documentElement.classList.toggle('dark')" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><svg x-show="!darkMode" class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg><svg x-show="darkMode" x-cloak class="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button></div></div>

  <div class="flex-1 flex flex-col lg:ml-64 min-h-screen">

    <main class="flex-1 pb-20 lg:pb-0" x-data="chatListPage()">

            <div class="relative">
              <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>

            </div>
          </div>
          <!-- 필터 탭 -->
          <div class="flex gap-1 px-3 py-2 border-b border-gray-100 dark:border-gray-700">
            <button @click="filter='all'" class="px-3 py-1 text-xs rounded-full" :class="filter==='all'?'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-medium':'text-gray-500'">전체</button>
            <button @click="filter='direct'" class="px-3 py-1 text-xs rounded-full" :class="filter==='direct'?'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-medium':'text-gray-500'">1:1</button>
            <button @click="filter='group'" class="px-3 py-1 text-xs rounded-full" :class="filter==='group'?'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-medium':'text-gray-500'">그룹</button>
            <button @click="filter='project'" class="px-3 py-1 text-xs rounded-full" :class="filter==='project'?'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-medium':'text-gray-500'">프로젝트</button>
          </div>
          <!-- 채팅방 리스트 -->
          <div class="flex-1 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-700">
            <template x-for="room in filteredRooms" :key="room.id">
              <button @click="selectedRoom=room" class="w-full text-left px-4 py-3 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors flex items-center gap-3" :class="selectedRoom?.id===room.id?'bg-indigo-50 dark:bg-indigo-900/20':''">
                <!-- 아바타 -->
                <div class="relative flex-shrink-0">
                  <div class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-medium" :class="room.type==='group'||room.type==='project'?'bg-indigo-100 dark:bg-indigo-900 text-indigo-600 dark:text-indigo-400':'bg-gray-200 dark:bg-gray-600 text-gray-600 dark:text-gray-300'" x-text="room.avatar"></div>
                  <div x-show="room.online" class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 rounded-full border-2 border-white dark:border-gray-800"></div>
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center justify-between">
                    <p class="text-sm font-medium truncate" x-text="room.name"></p>
                    <span class="text-[10px] text-gray-400 dark:text-gray-500 flex-shrink-0" x-text="room.time"></span>
                  </div>
                  <div class="flex items-center justify-between mt-0.5">
                    <p class="text-xs text-gray-500 dark:text-gray-400 truncate" x-text="room.lastMessage"></p>
                    <span x-show="room.unread>0" class="ml-1 w-5 h-5 bg-red-500 text-white rounded-full text-[10px] flex items-center justify-center font-bold flex-shrink-0" x-text="room.unread"></span>
                  </div>
                </div>
              </button>
            </template>
          </div>
        </div>

        <!-- 대화 영역 -->
        <div class="flex-1 flex flex-col" :class="selectedRoom?'flex':'hidden lg:flex'">
          <template x-if="selectedRoom">
            <div class="flex flex-col h-full">
              <!-- 대화 헤더 -->
              <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 flex items-center gap-3">
                <button @click="selectedRoom=null" class="lg:hidden p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></button>

                <div class="flex-1"><p class="text-sm font-medium" x-text="selectedRoom.name"></p><p class="text-[10px] text-gray-400" x-text="selectedRoom.members+'명 참여'"></p></div>
                <button class="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded"><svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></button>
              </div>
              <!-- 메시지 영역 -->
              <div class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50 dark:bg-gray-900">
                <div class="text-center"><span class="text-[10px] px-2 py-0.5 bg-gray-200 dark:bg-gray-700 text-gray-500 dark:text-gray-400 rounded-full">2026년 3월 15일</span></div>
                <!-- 상대방 메시지 -->
                <div class="flex items-end gap-2 max-w-[70%]">
                  <div class="w-7 h-7 bg-purple-100 dark:bg-purple-900 rounded-full flex items-center justify-center text-[10px] font-medium text-purple-600 dark:text-purple-400 flex-shrink-0">박</div>
                  <div><div class="bg-white dark:bg-gray-800 rounded-2xl rounded-bl-sm px-3 py-2 text-sm shadow-sm">메인 시안 v3 수정 완료했습니다! 확인 부탁드려요 🎨</div><span class="text-[10px] text-gray-400 mt-0.5 block">박디자이너 · 오후 2:15</span></div>
                </div>
                <!-- 내 메시지 -->
                <div class="flex items-end gap-2 max-w-[70%] ml-auto flex-row-reverse">
                  <div><div class="bg-indigo-600 text-white rounded-2xl rounded-br-sm px-3 py-2 text-sm">좋아요! 지금 확인할게요 👍</div><div class="flex items-center justify-end gap-1 mt-0.5"><span class="text-[10px] text-gray-400">오후 2:18</span><span class="text-[10px] text-indigo-400">읽음</span></div></div>
                </div>
                <!-- 상대방 -->
                <div class="flex items-end gap-2 max-w-[70%]">
                  <div class="w-7 h-7 bg-purple-100 dark:bg-purple-900 rounded-full flex items-center justify-center text-[10px] font-medium text-purple-600 flex-shrink-0">박</div>
                  <div><div class="bg-white dark:bg-gray-800 rounded-2xl rounded-bl-sm px-3 py-2 text-sm shadow-sm">히어로 섹션 애니메이션도 추가했어요. 모바일에서도 잘 동작합니다.</div><span class="text-[10px] text-gray-400 mt-0.5 block">박디자이너 · 오후 2:20</span></div>
                </div>
                <!-- 파일 첨부 메시지 -->
                <div class="flex items-end gap-2 max-w-[70%]">
                  <div class="w-7 h-7 bg-purple-100 dark:bg-purple-900 rounded-full flex items-center justify-center text-[10px] font-medium text-purple-600 flex-shrink-0">박</div>
                  <div><div class="bg-white dark:bg-gray-800 rounded-2xl rounded-bl-sm px-3 py-2 shadow-sm">
                    <div class="flex items-center gap-2 p-2 bg-gray-50 dark:bg-gray-700 rounded-lg"><svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg><div><p class="text-xs font-medium">main_hero_v3.png</p><p class="text-[10px] text-gray-400">1.2MB</p></div></div>
                  </div><span class="text-[10px] text-gray-400 mt-0.5 block">박디자이너 · 오후 2:22</span></div>
                </div>
              </div>
              <!-- 입력창 -->
              <div class="px-4 py-3 border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
                <div class="flex items-end gap-2">
                  <button class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg text-gray-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg></button>
                  <div class="flex-1 border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 bg-gray-50 dark:bg-gray-700"><textarea rows="1" placeholder="메시지 입력..." class="w-full text-sm bg-transparent outline-none resize-none"></textarea></div>
                  <button class="p-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg></button>
                </div>
              </div>
            </div>
          </template>
          <!-- 빈 상태 -->
          <div x-show="!selectedRoom" class="flex-1 flex items-center justify-center bg-gray-50 dark:bg-gray-900">
            <div class="text-center"><svg class="w-16 h-16 text-gray-300 dark:text-gray-600 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg><p class="text-gray-400 dark:text-gray-500 mt-3 text-sm">채팅방을 선택하거나 새 채팅을 시작하세요</p></div>
          </div>
        </div>
      </div>

      <!-- 새 채팅 모달 (D-13 통합) -->
      <div x-show="showCreate" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/50" @click="showCreate=false"></div>
        <div class="relative bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md p-6">
          <div class="flex items-center justify-between mb-5">
            <h3 class="text-lg font-bold">새 채팅</h3>
            <button @click="showCreate=false" class="p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
          </div>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium mb-1.5">멤버 검색</label>
              <input type="text" placeholder="이름 또는 이메일..." class="w-full px-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <!-- 멤버 목록 -->
            <div class="max-h-48 overflow-y-auto space-y-1">
              <template x-for="m in memberList" :key="m.id">
                <label class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer">
                  <input type="checkbox" class="w-4 h-4 text-indigo-600 rounded border-gray-300">
                  <div class="w-8 h-8 bg-gray-200 dark:bg-gray-600 rounded-full flex items-center justify-center text-xs font-medium" x-text="m.name[0]"></div>
                  <div><p class="text-sm font-medium" x-text="m.name"></p><p class="text-[10px] text-gray-400" x-text="m.role"></p></div>
                </label>
              </template>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1.5">그룹명 <span class="text-gray-400 font-normal">(선택, 3인 이상)</span></label>
              <input type="text" placeholder="예: 디자인팀 회의방" class="w-full px-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm outline-none">
            </div>
          </div>
          <div class="flex justify-end gap-2 mt-6">
            <button @click="showCreate=false" class="px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">취소</button>
            <button class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg">채팅 시작</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script>

function chatListPage(){return{
  filter:'all',selectedRoom:null,showCreate:false,
  rooms:[
    {id:1,name:'박디자이너',avatar:'박',type:'direct',online:true,members:2,lastMessage:'히어로 섹션 애니메이션도 추가했어요.',time:'오후 2:22',unread:2},
    {id:2,name:'디자인팀 회의방',avatar:'디',type:'group',online:false,members:4,lastMessage:'이디자이너: 금요일 회의 가능합니다',time:'오후 1:30',unread:0},
    {id:3,name:'최개발',avatar:'최',type:'direct',online:true,members:2,lastMessage:'API 수정 배포했습니다.',time:'오전 11:45',unread:1},
