<script>

function boardListPage(){return{
  activeCategory:'notice',search:'',
  categories:[{value:'notice',label:'공지사항',icon:'📌'},{value:'free',label:'자유게시판',icon:'💬'},{value:'archive',label:'자료실',icon:'📁'}],
  posts:[
    {id:1,title:'[필독] 3월 프로젝트 일정 안내',author:'김매니저',date:'2026-03-15',views:48,commentCount:5,pinned:true,hasFile:true,category:'notice'},
    {id:2,title:'신규 직원 온보딩 가이드 업데이트',author:'박대표',date:'2026-03-14',views:32,commentCount:2,pinned:true,hasFile:false,category:'notice'},
    {id:3,title:'3월 첫째 주 회의록',author:'이기획',date:'2026-03-10',views:21,commentCount:0,pinned:false,hasFile:true,category:'notice'},
    {id:4,title:'Contract Sync 사용 팁 공유합니다',author:'최개발',date:'2026-03-14',views:15,commentCount:8,pinned:false,hasFile:false,category:'free'},
    {id:5,title:'점심 맛집 추천해요 🍚',author:'박디자이너',date:'2026-03-13',views:27,commentCount:12,pinned:false,hasFile:false,category:'free'},
    {id:6,title:'금요일 팀 회식 투표',author:'김매니저',date:'2026-03-12',views:19,commentCount:6,pinned:false,hasFile:false,category:'free'},
    {id:7,title:'브랜드 가이드라인 v2.1',author:'박디자이너',date:'2026-03-11',views:14,commentCount:1,pinned:false,hasFile:true,category:'archive'},
    {id:8,title:'프로젝트 템플릿 모음 (PSD+AI)',author:'이디자이너',date:'2026-03-09',views:22,commentCount:3,pinned:false,hasFile:true,category:'archive'},
    {id:9,title:'개발 환경 세팅 문서',author:'최개발',date:'2026-03-08',views:11,commentCount:0,pinned:false,hasFile:true,category:'archive'},
  ],
  get filteredPosts(){
    let r=this.posts.filter(p=>p.category===this.activeCategory);
    if(this.search){const q=this.search.toLowerCase();r=r.filter(p=>p.title.toLowerCase().includes(q))}
    return r.sort((a,b)=>b.pinned-a.pinned);
  }
}}
</script>
