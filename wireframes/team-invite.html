<!DOCTYPE html>
<html lang="ko" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Sync v2 - 팀 초대</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300">
<div x-data="appLayout()" class="flex h-screen overflow-hidden">
  <aside class="hidden lg:flex lg:flex-col w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 fixed inset-y-0 left-0 z-30">
    <div class="flex items-center gap-3 px-6 py-5 border-b border-gray-200 dark:border-gray-700"><div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div><span class="text-lg font-bold dark:text-white">Contract Sync</span></div>
    <nav class="flex-1 px-3 py-4 space-y-1"><a href="settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-medium text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg><span>설정</span></a></nav>
    <div class="px-4 py-3 border-t border-gray-200 dark:border-gray-700"><div class="flex items-center gap-3"><div class="w-8 h-8 bg-amber-100 dark:bg-amber-900 rounded-full flex items-center justify-center"><span class="text-sm font-medium text-amber-600">박</span></div><div class="flex-1"><p class="text-sm font-medium truncate">박대표</p><p class="text-[10px] text-gray-400">owner</p></div></div></div>
  </aside>
  <div class="flex-1 flex flex-col lg:ml-64 min-h-screen">
    <header class="sticky top-0 z-20 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
      <div class="px-4 lg:px-6 py-3">
        <div class="text-sm text-gray-500 flex items-center gap-1"><a href="settings.html" class="hover:text-indigo-600">설정</a><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg><span>팀 관리</span><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg><span class="text-gray-800 dark:text-gray-200">멤버 초대</span></div>
        <h1 class="text-lg font-bold mt-0.5">이메일 초대</h1>
      </div>
    </header>
    <main class="flex-1 p-4 lg:p-6" x-data="teamInvitePage()">
      <div class="max-w-2xl mx-auto space-y-6">
        <!-- 초대 폼 -->
        <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6">
          <h3 class="text-base font-bold mb-4">새 멤버 초대</h3>
          <div class="flex flex-col sm:flex-row gap-3">
            <input type="email" x-model="inviteEmail" placeholder="이메일 주소 입력" class="flex-1 px-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            <select x-model="inviteRole" class="px-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm">
              <option value="member">멤버</option><option value="admin">관리자</option>
            </select>
            <button @click="sendInvite()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg flex items-center gap-1.5 whitespace-nowrap">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              초대 발송
            </button>
          </div>
          <div class="mt-3 p-3 bg-blue-50 dark:bg-blue-900/20 rounded-lg flex items-start gap-2">
            <svg class="w-4 h-4 text-blue-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <p class="text-xs text-blue-700 dark:text-blue-300">초대 이메일이 발송됩니다. 수신자가 링크를 클릭하면 Google 계정으로 가입 후 자동으로 팀에 합류합니다. 초대 링크는 <strong>7일 후 만료</strong>됩니다.</p>
          </div>
        </div>
        <!-- 대기 초대 목록 -->
        <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
          <div class="px-5 py-3 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
            <h3 class="text-sm font-semibold">대기 중인 초대 (<span x-text="invites.length"></span>)</h3>
          </div>
          <div class="divide-y divide-gray-100 dark:divide-gray-700">
            <template x-for="inv in invites" :key="inv.id">
              <div class="px-5 py-4 flex items-center gap-4">
                <div class="w-9 h-9 bg-gray-100 dark:bg-gray-700 rounded-full flex items-center justify-center"><svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg></div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-medium" x-text="inv.email"></p>
                  <div class="flex items-center gap-3 mt-0.5 text-xs text-gray-500 dark:text-gray-400">
                    <span x-text="'역할: '+inv.role"></span>
                    <span x-text="'초대일: '+inv.date"></span>
                    <span x-text="'만료: '+inv.expires"></span>
                  </div>
                </div>
                <span class="text-[10px] px-2 py-0.5 rounded-full font-medium" :class="{
                  'bg-amber-100 dark:bg-amber-900/30 text-amber-700':inv.status==='pending',
                  'bg-green-100 dark:bg-green-900/30 text-green-700':inv.status==='accepted',
                  'bg-red-100 dark:bg-red-900/30 text-red-700':inv.status==='expired'
                }" x-text="inv.status==='pending'?'대기 중':inv.status==='accepted'?'수락됨':'만료'"></span>
                <button x-show="inv.status==='pending'" class="p-1.5 hover:bg-red-50 dark:hover:bg-red-900/20 rounded text-red-400 hover:text-red-600" title="초대 취소"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
              </div>
            </template>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script>
function appLayout(){return{mobileMenuOpen:false,darkMode:false,init(){if(window.matchMedia('(prefers-color-scheme:dark)').matches){this.darkMode=true;document.documentElement.classList.add('dark')}}}}
function teamInvitePage(){return{
  inviteEmail:'',inviteRole:'member',
  invites:[
    {id:1,email:'newdesigner@gmail.com',role:'멤버',date:'03-14',expires:'03-21',status:'pending'},
    {id:2,email:'partner@agency.co.kr',role:'멤버',date:'03-12',expires:'03-19',status:'pending'},
    {id:3,email:'freelancer@mail.com',role:'관리자',date:'03-10',expires:'03-17',status:'accepted'},
    {id:4,email:'old@company.com',role:'멤버',date:'03-01',expires:'03-08',status:'expired'},
  ],
  sendInvite(){if(!this.inviteEmail)return;this.invites.unshift({id:Date.now(),email:this.inviteEmail,role:this.inviteRole==='admin'?'관리자':'멤버',date:'03-15',expires:'03-22',status:'pending'});this.inviteEmail=''}
}}
</script>
</body>
</html>
