<!DOCTYPE html>
<html lang="ko" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Sync v2 - 챗봇 자동 안내</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    [x-cloak] { display: none !important; }
    @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.3) translateY(20px); } 50% { opacity: 1; transform: scale(1.05); } 70% { transform: scale(0.95); } 100% { transform: scale(1) translateY(0); } }
    .bounce-in { animation: bounceIn 0.5s ease-out; }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade-slide-up { animation: fadeSlideUp 0.4s ease-out; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .dot-pulse { animation: pulse 1.5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300">

<div x-data="chatbotGreetingDemo()" class="min-h-screen relative">

  <!-- 시뮬레이션된 대시보드 배경 -->
  <div class="p-6 lg:ml-16">
    <div class="max-w-4xl mx-auto">
      <div class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl p-5 text-white mb-6">
        <h2 class="text-lg font-bold">👋 좋은 아침, 김매니저님!</h2>
        <p class="text-sm text-indigo-100 mt-1">오늘 마감 업무 2건</p>
      </div>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="h-24 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4">
          <p class="text-xs text-gray-500 dark:text-gray-400">진행 중 프로젝트</p>
          <p class="text-2xl font-bold mt-2">5</p>
        </div>
        <div class="h-24 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4">
          <p class="text-xs text-gray-500 dark:text-gray-400">내 업무</p>
          <p class="text-2xl font-bold mt-2">12</p>
        </div>
        <div class="h-24 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4">
          <p class="text-xs text-gray-500 dark:text-gray-400">이번 달 수금</p>
          <p class="text-2xl font-bold mt-2">3건</p>
        </div>
        <div class="h-24 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4">
          <p class="text-xs text-gray-500 dark:text-gray-400">알림</p>
          <p class="text-2xl font-bold mt-2">7</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 챗봇 플로팅 버튼 -->
  <div class="fixed bottom-6 right-6 z-40">
    <!-- 인사 말풍선 (3초 후 자동 표시) -->
    <div x-show="showGreeting && !chatOpen" x-cloak class="absolute bottom-full right-0 mb-3 fade-slide-up" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 p-4 w-72">
        <div class="flex items-start gap-3">
          <div class="w-8 h-8 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full flex items-center justify-center flex-shrink-0">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          </div>
          <div class="flex-1">
            <p class="text-sm font-medium text-gray-800 dark:text-gray-100">CS 어시스턴트</p>
            <p class="text-sm text-gray-600 dark:text-gray-300 mt-1">안녕하세요! Contract Sync에 오신 것을 환영합니다. 무엇을 도와드릴까요? 😊</p>
            <div class="flex gap-2 mt-3">
              <button @click="chatOpen = true; showGreeting = false" class="px-3 py-1.5 text-xs bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">대화 시작</button>
              <button @click="showGreeting = false" class="px-3 py-1.5 text-xs text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">닫기</button>
            </div>
          </div>
        </div>
        <!-- 말풍선 꼬리 -->
        <div class="absolute -bottom-2 right-8 w-4 h-4 bg-white dark:bg-gray-800 border-r border-b border-gray-200 dark:border-gray-700 transform rotate-45"></div>
      </div>
    </div>

    <!-- 플로팅 버튼 -->
    <button @click="chatOpen = !chatOpen; showGreeting = false" class="w-14 h-14 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-full shadow-lg flex items-center justify-center text-white hover:shadow-xl transition-all bounce-in" :class="{ 'ring-4 ring-indigo-300 dark:ring-indigo-800': showGreeting }">
      <svg x-show="!chatOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
      <svg x-show="chatOpen" x-cloak class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>

  <!-- 미니 챗 패널 (열린 상태) -->
  <div x-show="chatOpen" x-cloak x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-4 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100" class="fixed bottom-24 right-6 z-40 w-80 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 overflow-hidden">
    <!-- 헤더 -->
    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-4 py-3">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 bg-white/20 rounded-full flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        </div>
        <div>
          <p class="text-sm font-medium text-white">CS 어시스턴트</p>
          <p class="text-[10px] text-indigo-200">온라인</p>
        </div>
      </div>
    </div>
    <!-- 메시지 영역 -->
    <div class="h-64 p-4 overflow-y-auto bg-gray-50 dark:bg-gray-900">
      <!-- AI 인사 메시지 -->
      <div class="flex gap-2 mb-3">
        <div class="w-7 h-7 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full flex items-center justify-center flex-shrink-0">
          <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        </div>
        <div class="bg-white dark:bg-gray-800 rounded-xl rounded-tl-sm px-3 py-2 max-w-[85%] shadow-sm border border-gray-100 dark:border-gray-700">
          <p class="text-sm text-gray-700 dark:text-gray-200">안녕하세요! Contract Sync에 오신 것을 환영합니다. 😊</p>
          <p class="text-sm text-gray-700 dark:text-gray-200 mt-1.5">무엇을 도와드릴까요? 아래 자주 묻는 질문을 눌러보세요.</p>
        </div>
      </div>
      <!-- 프리셋 버튼 -->
      <div class="flex flex-wrap gap-1.5 ml-9">
        <button class="px-2.5 py-1 text-xs bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded-full text-gray-600 dark:text-gray-300 hover:border-indigo-400 dark:hover:border-indigo-500 transition-colors">📋 내 미완료 업무</button>
        <button class="px-2.5 py-1 text-xs bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded-full text-gray-600 dark:text-gray-300 hover:border-indigo-400 dark:hover:border-indigo-500 transition-colors">📊 진행 중 프로젝트</button>
        <button class="px-2.5 py-1 text-xs bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded-full text-gray-600 dark:text-gray-300 hover:border-indigo-400 dark:hover:border-indigo-500 transition-colors">⏰ 이번 주 마감</button>
      </div>
    </div>
    <!-- 입력창 -->
    <div class="px-3 py-2 border-t border-gray-200 dark:border-gray-700">
      <div class="flex items-center gap-2">
        <input type="text" placeholder="메시지를 입력하세요..." class="flex-1 px-3 py-2 text-sm bg-gray-100 dark:bg-gray-700 rounded-lg border-0 focus:ring-2 focus:ring-indigo-500 outline-none">
        <button class="p-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 컨트롤 패널 -->
  <div class="fixed top-4 right-4 z-[60] bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-lg p-3">
    <p class="text-xs text-gray-400 mb-2">와이어프레임 테스트</p>
    <div class="space-y-1">
      <button @click="resetGreeting()" class="w-full text-left px-2 py-1 text-xs text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded">자동 인사 재실행</button>
      <button @click="chatOpen = false; showGreeting = false" class="w-full text-left px-2 py-1 text-xs text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded">모두 닫기</button>
      <button @click="$el.closest('html')?.classList.toggle('dark')" class="w-full text-left px-2 py-1 text-xs text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded">다크모드</button>
    </div>
  </div>
</div>

<script>
function chatbotGreetingDemo() {
  return {
    showGreeting: false,
    chatOpen: false,

    init() {
      // 구현 시: localStorage.getItem('cs_chatbot_greeted') 확인 → 이미 본 사용자는 스킵
      // 인사 후: localStorage.setItem('cs_chatbot_greeted', 'true') 저장 → 1회만 표시
      // 와이어프레임에서는 항상 표시 (시연 용도)
      setTimeout(() => {
        if (!this.chatOpen) this.showGreeting = true;
      }, 2000);
    },

    resetGreeting() {
      this.chatOpen = false;
      this.showGreeting = false;
      setTimeout(() => { this.showGreeting = true; }, 2000);
    }
  }
}
</script>
</body>
</html>
