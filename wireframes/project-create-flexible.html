<!DOCTYPE html>
<html lang="ko" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Sync v2 - 새 프로젝트 (고객 유연 선택)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300">
<div x-data="projectCreatePage()" class="flex h-screen overflow-hidden">
  <!-- 사이드바 -->
  <aside class="hidden lg:flex lg:flex-col w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 fixed inset-y-0 left-0 z-30">
    <div class="flex items-center gap-3 px-6 py-5 border-b border-gray-200 dark:border-gray-700">
      <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div>
      <span class="text-lg font-bold dark:text-white">Contract Sync</span>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>대시보드</span></a>
      <a href="clients.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg><span>고객</span></a>
      <a href="projects.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-medium text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg><span>프로젝트</span></a>
      <a href="tasks.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg><span>업무</span></a>
      <a href="board-list.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg><span>게시판</span></a>
      <a href="chat-list.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg><span>채팅</span></a>
      <a href="settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg><span>설정</span></a>
    </nav>
    <div class="px-4 py-3 border-t border-gray-200 dark:border-gray-700">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-indigo-100 dark:bg-indigo-900 rounded-full flex items-center justify-center"><span class="text-sm font-medium text-indigo-600 dark:text-indigo-400">김</span></div>
        <div class="flex-1"><p class="text-sm font-medium truncate">김매니저</p><p class="text-xs text-gray-500 dark:text-gray-400 truncate">pm@company.com</p></div>
        <button @click="darkMode=!darkMode;document.documentElement.classList.toggle('dark')" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><svg x-show="!darkMode" class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg><svg x-show="darkMode" x-cloak class="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button>
      </div>
    </div>
  </aside>
  <div x-show="mobileMenuOpen" x-cloak @click="mobileMenuOpen=false" class="fixed inset-0 bg-black/50 z-40 lg:hidden"></div>

  <!-- 메인 -->
  <div class="flex-1 flex flex-col lg:ml-64 min-h-screen">
    <header class="sticky top-0 z-20 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
      <div class="flex items-center justify-between px-4 lg:px-6 py-3">
        <div class="flex items-center gap-3">
          <button @click="mobileMenuOpen=true" class="lg:hidden p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <div>
            <div class="text-sm text-gray-500 dark:text-gray-400 flex items-center gap-1">
              <a href="projects.html" class="hover:text-indigo-600">프로젝트</a>
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              <span class="text-gray-800 dark:text-gray-200">새 프로젝트</span>
            </div>
            <h1 class="text-lg font-bold">새 프로젝트</h1>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-1 p-4 lg:p-6 pb-20 lg:pb-6 overflow-y-auto">
      <div class="max-w-3xl mx-auto space-y-6">

        <!-- 와이어프레임 상태 전환 -->
        <div class="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-700 rounded-xl p-4">
          <p class="text-xs font-bold text-amber-700 dark:text-amber-300 mb-2">와이어프레임 상태 테스트</p>
          <div class="flex flex-wrap gap-2">
            <button @click="viewMode='create'" class="px-3 py-1 text-xs rounded-full" :class="viewMode==='create'?'bg-amber-600 text-white':'bg-amber-100 dark:bg-amber-800 text-amber-700 dark:text-amber-300'">프로젝트 생성 폼</button>
            <button @click="viewMode='detail-unlinked'" class="px-3 py-1 text-xs rounded-full" :class="viewMode==='detail-unlinked'?'bg-amber-600 text-white':'bg-amber-100 dark:bg-amber-800 text-amber-700 dark:text-amber-300'">상세 (미지정)</button>
            <button @click="viewMode='detail-linked'" class="px-3 py-1 text-xs rounded-full" :class="viewMode==='detail-linked'?'bg-amber-600 text-white':'bg-amber-100 dark:bg-amber-800 text-amber-700 dark:text-amber-300'">상세 (연결됨)</button>
          </div>
        </div>

        <!-- ========== 프로젝트 생성 폼 ========== -->
        <template x-if="viewMode==='create'">
          <div class="space-y-6">
            <!-- 기본 정보 -->
            <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6">
              <h3 class="text-base font-bold mb-5 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                기본 정보
              </h3>
              <div class="space-y-4">
                <div>
                  <label class="block text-sm font-medium mb-1.5">프로젝트명 <span class="text-red-500">*</span></label>
                  <input type="text" x-model="form.name" class="w-full px-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="프로젝트 이름을 입력하세요">
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1.5">유형 <span class="text-red-500">*</span></label>
                  <div class="flex gap-3">
                    <button @click="form.type='외주'" class="flex-1 px-4 py-3 border-2 rounded-xl text-sm text-center transition-colors" :class="form.type==='외주'?'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20 text-indigo-700 dark:text-indigo-300 font-medium':'border-gray-200 dark:border-gray-600 hover:border-gray-300'">
                      <svg class="w-5 h-5 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                      외주
                    </button>
                    <button @click="form.type='자체'" class="flex-1 px-4 py-3 border-2 rounded-xl text-sm text-center transition-colors" :class="form.type==='자체'?'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20 text-indigo-700 dark:text-indigo-300 font-medium':'border-gray-200 dark:border-gray-600 hover:border-gray-300'">
                      <svg class="w-5 h-5 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                      자체
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- 고객 선택 -->
            <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6">
              <h3 class="text-base font-bold mb-1 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                고객 선택
                <span x-show="form.type==='외주'" x-cloak class="text-xs text-gray-400 dark:text-gray-500 font-normal">(선택사항)</span>
              </h3>
              <p class="text-xs text-gray-500 dark:text-gray-400 mb-4" x-show="form.type==='외주'" x-cloak>나중에 프로젝트 상세에서 연결할 수 있습니다</p>

              <!-- 선택된 고객 표시 -->
              <div x-show="selectedClient" x-cloak class="flex items-center justify-between p-3 bg-indigo-50 dark:bg-indigo-900/20 border border-indigo-200 dark:border-indigo-700 rounded-lg mb-3">
                <div class="flex items-center gap-3">
                  <div class="w-8 h-8 bg-indigo-100 dark:bg-indigo-900 rounded-full flex items-center justify-center"><span class="text-xs font-bold text-indigo-600 dark:text-indigo-400" x-text="selectedClient?.name?.charAt(0)||''"></span></div>
                  <div>
                    <p class="text-sm font-medium" x-text="selectedClient?.name"></p>
                    <p class="text-xs text-gray-500 dark:text-gray-400" x-text="selectedClient?.business_number"></p>
                  </div>
                </div>
                <button @click="selectedClient=null" class="text-xs text-gray-400 hover:text-red-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
              </div>

              <!-- 고객 검색 드롭다운 -->
              <div x-show="!selectedClient" class="relative">
                <div class="relative">
                  <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                  <input type="text" x-model="clientSearch" @focus="showClientDropdown=true" @click.outside="showClientDropdown=false" class="w-full pl-9 pr-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="고객명 또는 사업자번호로 검색...">
                </div>

                <!-- 드롭다운 -->
                <div x-show="showClientDropdown" x-cloak class="absolute left-0 right-0 mt-1 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-lg z-[80] max-h-64 overflow-y-auto">
                  <!-- 검색 결과 있을 때 -->
                  <template x-for="client in filteredClients" :key="client.id">
                    <button @click="selectedClient=client; showClientDropdown=false; clientSearch=''" class="w-full text-left px-4 py-3 hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center gap-3 border-b border-gray-100 dark:border-gray-700 last:border-0">
                      <div class="w-8 h-8 bg-gray-100 dark:bg-gray-700 rounded-full flex items-center justify-center"><span class="text-xs font-bold text-gray-600 dark:text-gray-300" x-text="client.name.charAt(0)"></span></div>
                      <div>
                        <p class="text-sm font-medium" x-text="client.name"></p>
                        <p class="text-xs text-gray-500 dark:text-gray-400" x-text="client.business_number"></p>
                      </div>
                    </button>
                  </template>

                  <!-- 검색 결과 없을 때 -->
                  <div x-show="clientSearch.length>0 && filteredClients.length===0" class="p-4 text-center">
                    <p class="text-sm text-gray-500 dark:text-gray-400 mb-3">검색 결과가 없습니다</p>
                    <button @click="showClientModal=true; showClientDropdown=false" class="inline-flex items-center gap-1.5 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                      새 고객 등록하기
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- 기간/예산 -->
            <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6">
              <h3 class="text-base font-bold mb-5 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                기간 및 예산
              </h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium mb-1.5">시작일</label>
                  <input type="date" class="w-full px-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm outline-none focus:ring-2 focus:ring-indigo-500" value="2026-03-20">
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1.5">종료일</label>
                  <input type="date" class="w-full px-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm outline-none focus:ring-2 focus:ring-indigo-500" value="2026-06-30">
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1.5">계약 금액</label>
                  <div class="relative">
                    <input type="text" class="w-full px-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm outline-none focus:ring-2 focus:ring-indigo-500 pr-8" placeholder="0" value="50,000,000">
                    <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-gray-400">원</span>
                  </div>
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1.5">우선순위</label>
                  <select class="w-full px-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    <option>높음</option><option selected>보통</option><option>낮음</option>
                  </select>
                </div>
              </div>
              <div class="mt-4">
                <label class="block text-sm font-medium mb-1.5">설명</label>
                <textarea rows="3" class="w-full px-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm outline-none focus:ring-2 focus:ring-indigo-500 resize-none" placeholder="프로젝트에 대한 설명을 입력하세요..."></textarea>
              </div>
            </div>

            <!-- 액션 버튼 -->
            <div class="flex items-center justify-between">
              <a href="projects.html" class="px-4 py-2.5 text-sm text-gray-600 dark:text-gray-400 hover:text-gray-800">취소</a>
              <button class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg font-medium flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                프로젝트 생성
              </button>
            </div>
          </div>
        </template>

        <!-- ========== 프로젝트 상세 - 미지정 ========== -->
        <template x-if="viewMode==='detail-unlinked'">
          <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6">
            <h3 class="text-base font-bold mb-5">프로젝트 정보</h3>
            <div class="space-y-4">

    {id:3,name:'스마트웹에이전시',business_number:'220-81-98765'},
    {id:4,name:'(주)블루오션테크',business_number:'135-86-55432'}
  ],
  get filteredClients(){
    if(!this.clientSearch) return this.clients;
    const q=this.clientSearch.toLowerCase();
    return this.clients.filter(c=>c.name.toLowerCase().includes(q)||c.business_number.includes(q));
  }
