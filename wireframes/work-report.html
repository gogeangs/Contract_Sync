<!DOCTYPE html>
<html lang="ko" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Sync v2 - 퇴근 업무 보고</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    [x-cloak] { display: none !important; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease-out; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300">

<div x-data="workReportDemo()" class="min-h-screen flex items-center justify-center p-4">

  <!-- 업무 보고 모달 -->
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 w-full max-w-md overflow-hidden fade-in" x-show="!submitted">

    <!-- 헤더 -->
    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-6 py-4">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <div>
          <p class="text-white font-bold">오늘의 업무 보고</p>
          <p class="text-indigo-200 text-xs">AI가 오늘 활동을 자동 정리했어요</p>
        </div>
      </div>
    </div>

    <!-- 근무 시간 요약 -->
    <div class="px-6 py-3 bg-gray-50 dark:bg-gray-900/50 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
      <div class="flex items-center gap-4 text-sm">
        <div>
          <span class="text-gray-500 dark:text-gray-400">출근</span>
          <span class="font-medium ml-1">09:02</span>
        </div>
        <div class="text-gray-300 dark:text-gray-600">→</div>
        <div>
          <span class="text-gray-500 dark:text-gray-400">현재</span>
          <span class="font-medium ml-1">18:15</span>
        </div>
      </div>
      <span class="text-sm font-bold text-indigo-600 dark:text-indigo-400">8시간 13분</span>
    </div>

    <!-- AI 자동 요약 내용 -->
    <div class="px-6 py-4 space-y-3 max-h-72 overflow-y-auto">
      <template x-for="item in reportItems" :key="item.id">
        <div class="flex items-start gap-3">
          <span class="text-base mt-0.5 flex-shrink-0" x-text="item.icon"></span>
          <div class="flex-1 min-w-0">
            <p class="text-sm" x-text="item.text"></p>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5" x-text="item.project" x-show="item.project"></p>
          </div>
          <!-- 수정 가능 표시 -->
          <button class="p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-gray-400 flex-shrink-0" title="수정">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
          </button>
        </div>
      </template>
    </div>

    <!-- 메모 추가 -->
    <div class="px-6 pb-4">
      <div x-show="!showMemo">
        <button @click="showMemo = true" class="text-sm text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300 flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          메모 추가 (선택)
        </button>
      </div>
      <div x-show="showMemo" x-cloak>
        <textarea x-model="memo" rows="2" placeholder="추가할 내용이 있으면 작성하세요..." class="w-full px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
      </div>
    </div>

    <!-- 하단 버튼 -->
    <div class="px-6 py-4 border-t border-gray-200 dark:border-gray-700 flex gap-3">
      <button class="flex-1 px-4 py-2.5 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl transition-colors border border-gray-300 dark:border-gray-600">
        수정하기
      </button>
      <button @click="submitReport()" class="flex-1 px-4 py-2.5 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl transition-colors font-medium flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        제출 및 퇴근
      </button>
    </div>
  </div>

  <!-- 제출 완료 상태 -->
  <div x-show="submitted" x-cloak class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 w-full max-w-md p-8 text-center fade-in">
    <div class="w-16 h-16 bg-green-100 dark:bg-green-900/30 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-8 h-8 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
    </div>
    <h2 class="text-lg font-bold mb-2">업무 보고 제출 완료!</h2>
    <p class="text-sm text-gray-500 dark:text-gray-400">퇴근 시간이 자동으로 기록되었습니다</p>
    <div class="mt-4 bg-gray-50 dark:bg-gray-900 rounded-lg p-3 inline-block">
      <div class="flex items-center gap-4 text-sm">
        <div><span class="text-gray-400">출근</span> <span class="font-medium">09:02</span></div>
        <div class="text-gray-300">→</div>
        <div><span class="text-gray-400">퇴근</span> <span class="font-medium text-green-600 dark:text-green-400">18:15</span></div>
        <div class="text-gray-300">·</div>
        <div><span class="font-bold text-indigo-600 dark:text-indigo-400">8h 13m</span></div>
      </div>
    </div>
    <div class="mt-6">
      <button @click="submitted = false" class="px-4 py-2 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">다시 보기</button>
    </div>
  </div>

  <!-- 컨트롤 -->
  <div class="fixed top-4 right-4 z-50 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-lg p-3">
    <div class="space-y-1">
      <button @click="submitted = false" class="w-full text-left px-2 py-1 text-xs text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded">보고서 보기</button>
      <button @click="submitted = true" class="w-full text-left px-2 py-1 text-xs text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded">완료 상태</button>
      <button @click="$el.closest('html')?.classList.toggle('dark')" class="w-full text-left px-2 py-1 text-xs text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded">다크모드</button>
    </div>
  </div>
</div>

<script>
function workReportDemo() {
  return {
    submitted: false,
    showMemo: false,
    memo: '',

    reportItems: [
      { id: 1, icon: '✅', text: '디자인 시안 v2 완료', project: '홈페이지 리뉴얼' },
      { id: 2, icon: '🔄', text: 'API 연동 70% → 90%', project: 'ERP 시스템 구축' },
      { id: 3, icon: '💬', text: 'A사 피드백 회신 완료', project: '홈페이지 리뉴얼' },
      { id: 4, icon: '📝', text: '주간 회의록 게시판 등록', project: null },
      { id: 5, icon: '💬', text: '김디자이너에게 시안 수정 요청 전달', project: null },
      { id: 6, icon: '📋', text: '서버 세팅 업무 상태 → 진행 중', project: 'ERP 시스템 구축' }
    ],

    submitReport() {
      this.submitted = true;
    }
  }
}
</script>
</body>
</html>
