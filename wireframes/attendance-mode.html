<!DOCTYPE html>
<html lang="ko" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Sync v2 - 출퇴근 모드 선택</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300">
<div x-data="attendanceModePage()" class="flex h-screen overflow-hidden">
  <!-- 사이드바 -->
  <aside class="hidden lg:flex lg:flex-col w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 fixed inset-y-0 left-0 z-30">
    <div class="flex items-center gap-3 px-6 py-5 border-b border-gray-200 dark:border-gray-700">
      <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div>
      <span class="text-lg font-bold dark:text-white">Contract Sync</span>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>대시보드</span></a>
      <a href="my-attendance.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span>근태</span></a>
      <a href="settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-medium text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg><span>설정</span></a>
    </nav>
    <div class="px-4 py-3 border-t border-gray-200 dark:border-gray-700">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-amber-100 dark:bg-amber-900 rounded-full flex items-center justify-center"><span class="text-sm font-medium text-amber-600">박</span></div>
        <div class="flex-1"><p class="text-sm font-medium truncate">박대표</p><p class="text-[10px] text-gray-400">owner</p></div>
        <button @click="darkMode=!darkMode;document.documentElement.classList.toggle('dark')" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><svg x-show="!darkMode" class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg><svg x-show="darkMode" x-cloak class="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button>
      </div>
    </div>
  </aside>
  <div x-show="mobileMenuOpen" x-cloak @click="mobileMenuOpen=false" class="fixed inset-0 bg-black/50 z-40 lg:hidden"></div>

  <!-- 메인 -->
  <div class="flex-1 flex flex-col lg:ml-64 min-h-screen">
    <header class="sticky top-0 z-20 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
      <div class="flex items-center justify-between px-4 lg:px-6 py-3">
        <div class="flex items-center gap-3">
          <button @click="mobileMenuOpen=true" class="lg:hidden p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <div>
            <div class="text-sm text-gray-500 dark:text-gray-400 flex items-center gap-1">
              <a href="settings.html" class="hover:text-indigo-600">설정</a>
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              <a href="attendance-policy.html" class="hover:text-indigo-600">근무 정책</a>
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              <span class="text-gray-800 dark:text-gray-200">출퇴근 모드</span>
            </div>
            <h1 class="text-lg font-bold">출퇴근 모드 설정</h1>
          </div>
        </div>
        <span class="text-xs px-2 py-0.5 bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300 rounded-full">owner 전용</span>
      </div>
    </header>

    <main class="flex-1 p-4 lg:p-6 pb-20 lg:pb-6 overflow-y-auto">
      <div class="max-w-3xl mx-auto space-y-6">

        <!-- 와이어프레임 상태 전환 -->
        <div class="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-700 rounded-xl p-4">
          <p class="text-xs font-bold text-amber-700 dark:text-amber-300 mb-2">와이어프레임 뷰 전환</p>
          <div class="flex flex-wrap gap-2">
            <button @click="view='settings'" class="px-3 py-1 text-xs rounded-full" :class="view==='settings'?'bg-amber-600 text-white':'bg-amber-100 dark:bg-amber-800 text-amber-700 dark:text-amber-300'">모드 설정</button>
            <button @click="view='checkin-popup'" class="px-3 py-1 text-xs rounded-full" :class="view==='checkin-popup'?'bg-amber-600 text-white':'bg-amber-100 dark:bg-amber-800 text-amber-700 dark:text-amber-300'">출근 팝업</button>
            <button @click="view='checkout-panel'" class="px-3 py-1 text-xs rounded-full" :class="view==='checkout-panel'?'bg-amber-600 text-white':'bg-amber-100 dark:bg-amber-800 text-amber-700 dark:text-amber-300'">퇴근 패널</button>
            <button @click="view='records'" class="px-3 py-1 text-xs rounded-full" :class="view==='records'?'bg-amber-600 text-white':'bg-amber-100 dark:bg-amber-800 text-amber-700 dark:text-amber-300'">기록 비교</button>
          </div>
        </div>

        <!-- ========== 1. 모드 설정 ========== -->
        <template x-if="view==='settings'">
          <div class="space-y-6">
            <!-- 모드 선택 카드 -->
            <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6">
              <h3 class="text-base font-bold mb-5 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                출퇴근 모드
              </h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 자유 출퇴근 -->
                <button @click="mode='free'" class="text-left p-5 border-2 rounded-xl transition-colors" :class="mode==='free'?'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20':'border-gray-200 dark:border-gray-600 hover:border-gray-300'">
                  <div class="flex items-center gap-3 mb-3">
                    <div class="w-10 h-10 bg-green-100 dark:bg-green-900/30 rounded-lg flex items-center justify-center">
                      <svg class="w-5 h-5 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    </div>
                    <div>
                      <p class="text-sm font-bold">자유 출퇴근</p>
                      <p class="text-[10px] text-gray-500 dark:text-gray-400">유연 근무, 프리랜서</p>
                    </div>
                    <div x-show="mode==='free'" class="ml-auto">
                      <svg class="w-5 h-5 text-indigo-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                    </div>
                  </div>
                  <ul class="space-y-1.5 text-xs text-gray-600 dark:text-gray-400">
                    <li class="flex items-center gap-1.5"><svg class="w-3.5 h-3.5 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> 로그인 시 출근 팝업</li>
                    <li class="flex items-center gap-1.5"><svg class="w-3.5 h-3.5 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> 퇴근 버튼 클릭으로 퇴근</li>
                    <li class="flex items-center gap-1.5"><svg class="w-3.5 h-3.5 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> 지각/조퇴 개념 없음</li>
                    <li class="flex items-center gap-1.5"><svg class="w-3.5 h-3.5 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> 상태 항상 "정상"</li>
                  </ul>
                </button>
                <!-- 고정 출퇴근 -->
                <button @click="mode='fixed'" class="text-left p-5 border-2 rounded-xl transition-colors" :class="mode==='fixed'?'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20':'border-gray-200 dark:border-gray-600 hover:border-gray-300'">
                  <div class="flex items-center gap-3 mb-3">
                    <div class="w-10 h-10 bg-blue-100 dark:bg-blue-900/30 rounded-lg flex items-center justify-center">
                      <svg class="w-5 h-5 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                    <div>
                      <p class="text-sm font-bold">고정 출퇴근</p>
                      <p class="text-[10px] text-gray-500 dark:text-gray-400">정규 근무, 관공서</p>
                    </div>
                    <div x-show="mode==='fixed'" class="ml-auto">
                      <svg class="w-5 h-5 text-indigo-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                    </div>
                  </div>
                  <ul class="space-y-1.5 text-xs text-gray-600 dark:text-gray-400">
                    <li class="flex items-center gap-1.5"><svg class="w-3.5 h-3.5 text-blue-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> 정책 시간 기준 자동 판단</li>
                    <li class="flex items-center gap-1.5"><svg class="w-3.5 h-3.5 text-blue-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> 지각/조퇴/결근 자동 표시</li>
                    <li class="flex items-center gap-1.5"><svg class="w-3.5 h-3.5 text-blue-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> 출퇴근 시간 정책 설정</li>
                    <li class="flex items-center gap-1.5"><svg class="w-3.5 h-3.5 text-blue-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> 유예 시간 설정 가능</li>
                  </ul>
                </button>
              </div>
            </div>

            <!-- 고정 모드 시간 설정 (고정 모드 선택 시만 노출) -->
            <div x-show="mode==='fixed'" x-cloak class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6">
              <h3 class="text-base font-bold mb-5 flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                고정 모드 시간 설정
              </h3>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium mb-1.5">출근 시간</label>
                  <input type="time" value="09:00" class="w-full px-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                  <p class="text-[10px] text-gray-400 mt-1">이후 출근 시 '지각' 처리</p>
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1.5">퇴근 시간</label>
                  <input type="time" value="18:00" class="w-full px-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                  <p class="text-[10px] text-gray-400 mt-1">이전 퇴근 시 '조퇴' 처리</p>
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1.5">유예 시간</label>
                  <div class="flex items-center gap-2">
                    <input type="number" value="10" min="0" max="30" class="w-20 px-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    <span class="text-sm text-gray-500">분</span>
                  </div>
                  <p class="text-[10px] text-gray-400 mt-1">출근 시간 이후 유예</p>
                </div>
              </div>
            </div>

            <!-- 저장 버튼 -->
            <div class="flex justify-end">
              <button class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg font-medium">설정 저장</button>
            </div>
          </div>
        </template>

        <!-- ========== 2. 출근 팝업 (자유 모드) ========== -->
        <template x-if="view==='checkin-popup'">
          <div class="space-y-6">
            <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6 text-center">
              <p class="text-sm text-gray-500 dark:text-gray-400 mb-2">자유 출퇴근 모드 — 로그인 시 표시되는 팝업</p>
            </div>
            <!-- 팝업 프리뷰 -->
            <div class="flex justify-center">
              <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 w-full max-w-sm p-6 text-center">
                <div class="w-16 h-16 bg-indigo-100 dark:bg-indigo-900/30 rounded-full flex items-center justify-center mx-auto mb-4">
                  <svg class="w-8 h-8 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                </div>
                <h3 class="text-lg font-bold mb-1">좋은 아침이에요, 김매니저님!</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mb-1">2026년 3월 18일 (수) 오전 9:23</p>
                <p class="text-sm text-gray-600 dark:text-gray-300 mb-6">오늘 출근하시겠어요?</p>
                <div class="space-y-3">
                  <button class="w-full px-4 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium text-sm flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
                    출근하기
                  </button>
                  <button class="w-full px-4 py-3 text-gray-500 dark:text-gray-400 hover:text-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 rounded-xl text-sm">나중에</button>
                </div>
                <!-- 출근 완료 토스트 미리보기 -->
                <div class="mt-4 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-700 rounded-lg px-4 py-2.5 flex items-center gap-2">
                  <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                  <span class="text-sm text-green-700 dark:text-green-300">출근 기록되었습니다 (09:23)</span>
                </div>
              </div>
            </div>
          </div>
        </template>

        <!-- ========== 3. 퇴근 패널 (자유 모드) ========== -->
        <template x-if="view==='checkout-panel'">
          <div class="space-y-6">
            <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6 text-center">
              <p class="text-sm text-gray-500 dark:text-gray-400 mb-2">자유 출퇴근 모드 — [퇴근하기] 클릭 시 표시되는 패널</p>
            </div>
            <!-- 퇴근 패널 프리뷰 -->
            <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700 max-w-lg mx-auto overflow-hidden">
              <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-6 py-4 text-white">
                <p class="text-sm opacity-80">퇴근 및 업무 보고</p>
                <p class="text-lg font-bold">오늘 하루 수고했어요!</p>
                <div class="flex items-center gap-4 mt-2 text-sm opacity-80">
                  <span>출근: 09:23</span>
                  <span>현재: 18:15</span>
                  <span>근무: 8시간 52분</span>
                </div>
              </div>
              <div class="p-6 space-y-4">
                <div>
