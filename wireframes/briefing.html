<!DOCTYPE html>
<html lang="ko" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Sync v2 - 오늘의 브리핑</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300">

<div x-data="briefingPage()" class="max-w-2xl mx-auto p-4 lg:p-6 mt-8">

  <!-- 브리핑 카드 -->
  <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 overflow-hidden shadow-sm">
    <!-- 인사말 헤더 -->
    <div class="bg-gradient-to-r from-indigo-500 to-purple-600 px-6 py-5">
      <div class="flex items-center gap-3">
        <span class="text-2xl">👋</span>
        <div>
          <h2 class="text-white text-lg font-bold" x-text="greeting + ', ' + userName + '님!'"></h2>
          <p class="text-indigo-100 text-sm mt-0.5" x-text="dateStr"></p>
        </div>
      </div>
    </div>

    <!-- 브리핑 항목 리스트 -->
    <div class="divide-y divide-gray-100 dark:divide-gray-700" x-show="items.length > 0">
      <template x-for="item in items" :key="item.id">
        <div class="flex items-center gap-4 px-6 py-4 hover:bg-gray-50 dark:hover:bg-gray-700/30 transition-colors">
          <!-- 아이콘 -->
          <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" :class="item.iconBg">
            <span class="text-lg" x-text="item.icon"></span>
          </div>
          <!-- 텍스트 -->
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium" x-text="item.text"></p>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5" x-text="item.sub" x-show="item.sub"></p>
          </div>
          <!-- 액션 버튼 -->
          <button @click="handleAction(item)" class="px-3 py-1.5 text-xs font-medium rounded-lg transition-colors flex-shrink-0" :class="item.btnClass" x-text="item.btnText"></button>
        </div>
      </template>
    </div>

    <!-- 항목 없을 때 -->
    <div class="px-6 py-8 text-center" x-show="items.length === 0">
      <span class="text-3xl">✨</span>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-3">오늘은 특별한 알림이 없어요!<br>좋은 하루 되세요</p>
    </div>

    <!-- 출근 토스트 -->
    <div x-show="showCheckInToast" x-cloak x-transition class="mx-6 mb-4 p-3 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 rounded-lg flex items-center gap-2">
      <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
      <div>
        <p class="text-sm font-medium text-green-700 dark:text-green-300">출근이 기록되었습니다</p>
        <p class="text-xs text-green-600 dark:text-green-400" x-text="checkInTime"></p>
      </div>
    </div>
  </div>

  <!-- 와이어프레임 전환 컨트롤 -->
  <div class="mt-6 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4">
    <p class="text-xs text-gray-400 dark:text-gray-500 mb-3">와이어프레임 테스트: 시나리오 전환</p>
    <div class="flex flex-wrap gap-2">
      <button @click="setScenario('morning')" class="px-3 py-1.5 text-xs rounded-lg" :class="scenario === 'morning' ? 'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 font-medium' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'">바쁜 아침</button>
      <button @click="setScenario('afternoon')" class="px-3 py-1.5 text-xs rounded-lg" :class="scenario === 'afternoon' ? 'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 font-medium' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'">한가한 오후</button>
      <button @click="setScenario('empty')" class="px-3 py-1.5 text-xs rounded-lg" :class="scenario === 'empty' ? 'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 font-medium' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'">알림 없음</button>
      <button @click="$el.closest('html')?.classList.toggle('dark')" class="px-3 py-1.5 text-xs bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-lg">다크모드</button>
    </div>
  </div>
</div>

<script>
function briefingPage() {
  return {
    userName: '김매니저',
    scenario: 'morning',
    showCheckInToast: false,
    checkInTime: '',

    get greeting() {
      const h = new Date().getHours();
      if (h >= 6 && h < 12) return '좋은 아침';
      if (h >= 12 && h < 18) return '좋은 오후';
      return '좋은 저녁';
    },

    get dateStr() {
      const d = new Date();
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
    },

    get items() {
      if (this.scenario === 'empty') return [];
      if (this.scenario === 'afternoon') return [
        { id: 1, icon: '🟡', iconBg: 'bg-amber-50 dark:bg-amber-900/20', text: '내일 마감 업무 1건', sub: 'API 연동 테스트', btnText: '확인하기', btnClass: 'bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300 hover:bg-amber-200 dark:hover:bg-amber-900/50' },
        { id: 2, icon: '💬', iconBg: 'bg-blue-50 dark:bg-blue-900/20', text: '채팅 2건 읽지 않음', sub: null, btnText: '읽기', btnClass: 'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 hover:bg-blue-200 dark:hover:bg-blue-900/50' }
      ];
      // morning (바쁜 아침)
      return [
        { id: 1, icon: '🔴', iconBg: 'bg-red-50 dark:bg-red-900/20', text: '오늘 마감 업무 2건', sub: '디자인 시안 v3, 기획서 최종 검토', btnText: '확인하기', btnClass: 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 hover:bg-red-200 dark:hover:bg-red-900/50' },
        { id: 2, icon: '🟡', iconBg: 'bg-amber-50 dark:bg-amber-900/20', text: '내일 마감 업무 1건', sub: 'API 연동 테스트', btnText: '확인하기', btnClass: 'bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300 hover:bg-amber-200 dark:hover:bg-amber-900/50' },
        { id: 3, icon: '📩', iconBg: 'bg-purple-50 dark:bg-purple-900/20', text: '고객 피드백 1건 미확인', sub: 'A사 홈페이지 리뉴얼 — 승인', btnText: '확인하기', btnClass: 'bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300 hover:bg-purple-200 dark:hover:bg-purple-900/50' },
        { id: 4, icon: '💬', iconBg: 'bg-blue-50 dark:bg-blue-900/20', text: '채팅 5건 읽지 않음', sub: null, btnText: '읽기', btnClass: 'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 hover:bg-blue-200 dark:hover:bg-blue-900/50' },
        { id: 5, icon: '⚠️', iconBg: 'bg-orange-50 dark:bg-orange-900/20', text: '진행 중 업무 2건 3일간 변동 없음', sub: 'DB 설계, 서버 세팅', btnText: '확인하기', btnClass: 'bg-orange-100 dark:bg-orange-900/30 text-orange-700 dark:text-orange-300 hover:bg-orange-200 dark:hover:bg-orange-900/50' },
        { id: 6, icon: '⏰', iconBg: 'bg-green-50 dark:bg-green-900/20', text: '오늘 출근 기록이 없어요', sub: null, btnText: '업무 시작하기', btnClass: 'bg-indigo-600 text-white hover:bg-indigo-700' }
      ];
    },

    setScenario(s) {
      this.scenario = s;
      this.showCheckInToast = false;
    },

    handleAction(item) {
      if (item.btnText === '업무 시작하기') {
        this.showCheckInToast = true;
        const now = new Date();
        this.checkInTime = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} 출근 완료`;
        this.items.splice(this.items.indexOf(item), 1);
        setTimeout(() => { this.showCheckInToast = false; }, 3000);
      }
    }
  }
}
</script>
</body>
</html>
